<style>
:root{
  --spruce:#24413B; --porcelain:#F1F0EB; --brass:#A5834B; --mist:#9DB4AC; --ink:#1F2724;
  --white:#FFFFFF; --line:#D8D6CE; --soft:#E7E5DD; --danger:#8A3B2E;
  --serif:Charter,'Bitstream Charter',Georgia,'Times New Roman',serif;
  --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--porcelain);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5}
header{background:var(--spruce);color:var(--porcelain);padding:18px 24px;display:flex;align-items:center;gap:14px;border-bottom:4px solid var(--brass)}
header .mark{flex:0 0 auto}
header h1{font-family:var(--serif);font-size:1.35rem;font-weight:bold;letter-spacing:.2px}
header .sub{font-size:.78rem;color:var(--mist);letter-spacing:.14em;text-transform:uppercase;margin-top:2px}
.wrap{max-width:1040px;margin:0 auto;padding:20px 18px 80px}
nav{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0}
nav button{font-family:var(--sans);font-size:.92rem;font-weight:600;padding:10px 16px;border:1.5px solid var(--spruce);border-radius:999px;background:var(--white);color:var(--spruce);cursor:pointer}
nav button.active{background:var(--spruce);color:var(--porcelain)}
nav button:hover{border-color:var(--brass)}
.bar{background:var(--soft);border-radius:8px;height:14px;overflow:hidden;margin:6px 0 2px}
.bar>div{background:var(--brass);height:100%;border-radius:8px;transition:width .3s}
.progress-label{font-size:.85rem;color:var(--spruce)}
.review-flag{background:#FBF3E2;border:1px solid var(--brass);border-radius:10px;padding:10px 14px;margin:12px 0 0;font-size:.9rem;color:#6b5525;display:none}
.review-flag.show{display:block}
section.tab{display:none;background:var(--white);border:1px solid var(--line);border-radius:14px;padding:22px}
section.tab.active{display:block}
h2{font-family:var(--serif);font-size:1.5rem;margin-bottom:6px}
h3{font-family:var(--serif);font-size:1.15rem;margin:22px 0 4px;color:var(--spruce)}
.note{font-size:.9rem;color:#5c6660;margin-bottom:14px}
.phase{margin-bottom:26px}
.task{display:flex;gap:12px;align-items:flex-start;padding:10px 8px;border-bottom:1px solid var(--soft)}
.task:last-child{border-bottom:none}
.task input[type=checkbox]{width:22px;height:22px;accent-color:var(--spruce);margin-top:3px;flex:0 0 auto;cursor:pointer}
.task .t{font-weight:600}
.task .why{font-size:.86rem;color:#5c6660;margin-top:2px}
.task.done .t{color:#7a827d;text-decoration:line-through}
table{width:100%;border-collapse:collapse;margin-top:10px}
th{font-size:.78rem;text-transform:uppercase;letter-spacing:.06em;color:var(--spruce);text-align:left;padding:8px 6px;border-bottom:2px solid var(--spruce)}
td{padding:6px 4px;border-bottom:1px solid var(--soft);vertical-align:middle}
td input,td select{width:100%;font-family:var(--sans);font-size:.92rem;padding:7px 8px;border:1px solid var(--line);border-radius:7px;background:#FCFBF8;color:var(--ink)}
td input:focus,td select:focus{outline:2px solid var(--brass);border-color:var(--brass)}
td.num input{text-align:right}
.del{background:none;border:none;color:var(--danger);font-size:1.05rem;cursor:pointer;padding:4px 8px}
.add{margin-top:12px;background:var(--spruce);color:var(--porcelain);border:none;border-radius:999px;padding:10px 18px;font-weight:600;font-size:.92rem;cursor:pointer}
.add:hover{background:#2E5249}
.totals{margin-top:12px;font-family:var(--serif);font-size:1.05rem;color:var(--spruce)}
.totals strong{color:var(--ink)}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
.toolbar button{border:1.5px solid var(--spruce);background:var(--white);color:var(--spruce);border-radius:999px;padding:10px 16px;font-weight:600;font-size:.9rem;cursor:pointer}
.toolbar button.primary{background:var(--spruce);color:var(--porcelain)}
.toolbar button:hover{border-color:var(--brass)}
.pill{display:inline-block;background:var(--soft);border-radius:999px;padding:2px 10px;font-size:.78rem;color:var(--spruce);margin-left:8px}
/* Wide registers (Home Inventory's 13-column inventory table is the worst
   case in the catalogue) squeeze every column to illegibility when forced
   into the 1040px wrap at width:100% — a number input's spinner arrows alone
   can eat a 5%-wide column, so the digit inside never renders at all. Give
   the table room to be its natural width and let the wrapper scroll instead
   of compressing. Found by actually looking at a screenshot, not by reading
   the column list. */
.table-wrap{overflow-x:auto;margin-top:10px}
.table-wrap table{margin-top:0}
.wish{margin:0 0 22px}
.wish label{display:block;font-family:var(--serif);font-size:1.12rem;color:var(--spruce);margin-bottom:2px}
.wish .prompt{font-size:.86rem;color:#5c6660;margin-bottom:8px}
.wish textarea{width:100%;min-height:110px;font-family:var(--sans);font-size:.95rem;line-height:1.5;padding:11px 12px;border:1px solid var(--line);border-radius:9px;background:#FCFBF8;color:var(--ink);resize:vertical}
.wish textarea:focus{outline:2px solid var(--brass);border-color:var(--brass)}
.warnline{font-size:.82rem;color:var(--danger);margin-top:6px;font-weight:600}
.savebar{position:fixed;bottom:0;left:0;right:0;background:var(--spruce);color:var(--mist);font-size:.82rem;padding:8px 18px;display:flex;justify-content:space-between;align-items:center}
.savebar b{color:var(--porcelain)}
.disclaimer{font-size:.8rem;color:#6a736d;margin-top:18px;border-top:1px solid var(--soft);padding-top:10px}
.review-box{background:#F7F6F1;border:1px solid var(--line);border-radius:11px;padding:16px 18px;margin:6px 0 16px}
.review-box .rl{font-family:var(--serif);font-size:1.05rem;color:var(--spruce)}
.review-box .rl strong{color:var(--ink)}
/* First-open notice: storage truth + erase truth + (per product) safety guidance.
   Shown on EVERY open, not just the first — a disclaimer that appears only at
   first start-up is exactly what sank the defence in UPLC v. Parsons Technology. */
.qk-veil{position:fixed;inset:0;background:rgba(31,39,36,.72);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px;overflow-y:auto}
.qk-veil[hidden]{display:none}
.qk-notice{background:var(--white);border:1px solid var(--line);border-radius:14px;max-width:640px;width:100%;padding:26px 28px;margin:auto}
.qk-notice h2{font-family:var(--serif);font-size:1.35rem;color:var(--spruce);margin-bottom:10px}
.qk-notice p{font-size:.92rem;color:#3f4945;margin-bottom:12px}
.qk-notice .hot{background:#FBF3E2;border:1px solid var(--brass);border-radius:10px;padding:12px 14px;font-size:.92rem;color:#5d4a20;margin-bottom:14px}
.qk-notice .hot b{color:var(--ink)}
.qk-notice .fine{font-size:.8rem;color:#6a736d;border-top:1px solid var(--soft);padding-top:10px;margin-bottom:16px}
.savebar .right{display:flex;align-items:center;gap:10px}
.savebar .erase{background:none;border:1px solid var(--mist);color:var(--porcelain);border-radius:999px;padding:4px 12px;font-size:.78rem;font-weight:600;cursor:pointer}
.savebar .erase:hover{background:var(--danger);border-color:var(--danger)}
#print-area{display:none}
@media print{
  body *{visibility:hidden}
  #print-area,#print-area *{visibility:visible}
  #print-area{display:block;position:absolute;top:0;left:0;width:100%;font-family:var(--serif);color:#000}
  #print-area h1{font-size:22pt;margin-bottom:2pt}
  #print-area .ph{font-size:9pt;letter-spacing:.14em;text-transform:uppercase;margin-bottom:14pt;color:#333}
  #print-area h2{font-size:13pt;margin:16pt 0 4pt;border-bottom:1pt solid #000;padding-bottom:2pt}
  #print-area h3{font-size:11pt;margin:10pt 0 2pt}
  #print-area table{width:100%;border-collapse:collapse;font-size:10pt;margin-top:4pt}
  #print-area th,#print-area td{border-bottom:.5pt solid #999;padding:3pt 4pt;text-align:left;vertical-align:top}
  #print-area p{font-size:10pt;margin:4pt 0}
  #print-area .lead{font-size:11pt;margin:6pt 0 10pt}
  #print-area .wblock{font-size:10.5pt;margin:2pt 0 10pt;white-space:pre-wrap}
  #print-area .foot{font-size:8.5pt;color:#333;margin-top:14pt;border-top:.5pt solid #999;padding-top:6pt}
}
@media(max-width:640px){
  .wrap{padding:14px 10px 90px}
  section.tab{padding:14px}
  th,td{font-size:.85rem}
}
</style>

/* Quietkeep data-driven engine. Everything product-specific lives in CONFIG,

const CONFIG={"name":"Caregiving Companion","storageKey":"qk-caregiving-companion","backupPrefix":"caregiving","tasks":{"tab":"Tasks","heading":"Guided Tasks","intro":"Forty-one steps across five phases, at whatever pace your week allows — a few now, more later. Everything saves automatically on this device, and each step notes why it matters. The first three phases build the picture; the fourth is about sharing the load, which is where most families come unstuck; the fifth is for handing it over. This is an organizer for care information, not medical advice: it records what's true so the right people can act, and it never diagnoses, doses, or rates anything. It never asks for an insurance, Medicare, or account number — only where those cards and documents live.","disclaimer":"This is an organizer, not medical advice and not a professional care plan. It records information; it does not diagnose or dose. For medical decisions, consult the treating clinician."},"phases":[{"name":"Phase 1 · Get the Picture","tasks":[["List the health conditions that matter","The two or three a new doctor or ER should know first. You don't need a chart — just the headlines."],["Note allergies and anything an ER must know","Drug allergies especially. This is the line that can prevent a bad reaction on a hard day."],["List every medication, including over-the-counter","Prescriptions, vitamins, and the things in the kitchen cabinet. Interactions hide in the ones people forget to mention. Add each to the Medications tab."],["Record when each one started, and when it last changed","A list with no dates can't be checked against a discharge summary. The Medications tab holds both, plus whether each one is still being taken — keep the stopped ones rather than deleting them."],["Record blood type if known","Not essential, but useful in an emergency and easy to record once."],["Note where the insurance / Medicare card lives","The card, not the number. 'Wallet' or 'top drawer' is enough — a card no one can find is the first delay at every visit."],["Note where an advance directive or POLST lives","If one exists, its location matters more than anything. If one doesn't, that's worth a gentle conversation someday."],["Add the health facts to the Health Facts tab","Conditions, allergies, blood type, and where the cards and documents live — the ER grab-list, in one place."]]},{"name":"Phase 2 · Build the Team","tasks":[["List the primary doctor and how to reach them","The first call when something changes. Name, practice, and the number that actually reaches a human."],["List specialists and what each treats","Cardiology, oncology, whoever. A new caregiver shouldn't have to guess which doctor handles what."],["Note the best way to actually reach each one","A direct line, a portal message, a front desk, an after-hours number. Knowing which one works is half the job on a bad afternoon, and it is the first thing a sibling stepping in gets wrong."],["Note the pharmacy and whether it delivers","Where refills live, and whether someone has to drive for them. Delivery changes who can help from a distance."],["List any home health or aide support","Agency, aide names, and the hours they cover. The schedule is part of the plan."],["Name family members who help, and how","Who drives to appointments, who handles bills, who visits. Writing it down is how the load gets shared instead of assumed."],["Set an emergency contact and a backup","The person to reach first, and the person to reach if the first can't be found."],["Add each person to the Care Team tab","One row per person: role, phone, and a note. This becomes the directory anyone can use."]]},{"name":"Phase 3 · Run the Day-to-Day","tasks":[["Record the medication schedule for a normal day","Morning, midday, evening, bedtime — what's taken when. A fill-in caregiver lives or dies by this."],["Add each medication to the Medications tab","Dose, schedule, prescriber, and what it's for — the list every new provider asks for."],["Note mobility needs and any equipment","Walker, wheelchair, oxygen, a shower chair. What they use, and where it is."],["Note dietary needs and food preferences","Restrictions that matter for their health, and the foods that make a hard day better."],["Note what they can and can't do alone","Bathing, cooking, driving, managing money. An honest list here is what right-sized help is built on."],["Record the weekly rhythm of appointments","Dialysis on Tuesdays, physical therapy on Thursdays. The pattern a substitute needs to keep."],["Write down what happened at each appointment","Who was seen, what changed, and what happens next. Six months on nobody remembers which visit the dose changed at — the Appointments tab does, and a sibling who wasn't in the room can catch up in a minute."],["Log what changed, on the day you noticed it","A fall, a confused afternoon, a week off their food, a good stretch worth remembering. Plain words and a date in the What's Changed tab. You are recording, not diagnosing: the pattern across months is what a clinician needs and what nobody can reconstruct from memory."],["Log who covered what, as it happens","One line per visit, drive, or errand, with roughly how long it took. It takes seconds, and it is the only record of work that is otherwise completely invisible."]]},{"name":"Phase 4 · Share the Load","tasks":[["Agree who does what — and write it down","Even a rough split. Ambiguity is where caregiver resentment grows; a written plan defuses it. Roles go in the Care Team tab, and what actually happens goes in Who Covered What."],["Log every care expense, whoever paid it","Prescriptions, groceries, the fuel to get there, the grab rail. It is never one big number — it is a hundred small ones nobody adds up, which is exactly why it turns into a grievance."],["Record what has been paid back, and by whom","The Care Expenses tab subtracts as you go, so the outstanding figure is simply there. Nobody has to work it out, and nobody has to ask."],["Note whose money each thing came from","Yours, a sibling's, or theirs. Where one person is handling a parent's money on their behalf, keeping the two apart on paper from the start is what makes the question easy to answer if it is ever asked."],["Send the family the same summary every month","The Family Summary sheet prints the hours, the spend, and what is outstanding. Sent to everyone on the same day each month, it takes away the two things families actually fall out over: who is doing more, and where the money went."],["Name what happens if you get sick","The likeliest disruption to this whole plan is you. Put a second person in the Care Team tab as backup caregiver, tell them the file exists, and show them where it lives."],["Book one break, and log it like any other cover","A short break you can count on beats a long one someday. Log it in Who Covered What so it is as real as everyone else's hours — and so you can see whether it actually happened."]]},{"name":"Phase 5 · Plan Ahead & Hand Off","tasks":[["Write their care wishes and preferences","How they like their day, what comforts them, what they'd want if choices arise. In the Wishes tab, in plain words."],["Note where legal and financial documents live","Power of attorney, healthcare proxy, will, the policies, and where the bills are managed — the locations and who holds a copy, never the contents. It all goes in the Documents tab."],["Choose a backup caregiver — and ask them","Someone who could step in for a week if you couldn't. The plan is only real if a second person knows it exists."],["Ask the doctor what should trigger a call, and what should trigger 911","Every condition is different, so the line belongs to their clinician, not to a rule of thumb. Ask at the next appointment and write their answer down while you have it — decided calmly, in their words, not guessed at in a panic."],["Record every hospital stay, and check the medications afterwards","Discharge is where the list and reality drift apart. The Hospital Stays tab holds each admission and, more importantly, whether the Medications tab has actually been checked against the discharge papers yet."],["Print the ER sheet and keep it where it can be grabbed","On the fridge, in the go-bag, with the medications. One page: conditions, allergies, medications, who to call, where the directive is."],["Print the fill-in caregiver sheet before anyone covers for you","Routine, food, what soothes them, the medication schedule, who to call. Someone new should not have to ask them, and they should not have to explain themselves twice."],["Download a backup file","From the Summary tab. Keep it somewhere safe, like a USB drive — this file lives in one browser on one device, and a backup is the only copy that survives a lost laptop."],["Review after any hospital stay or new diagnosis","Care changes fastest right after a hospital visit. Update while the discharge papers are still on the counter."]]}],"registers":[{"id":"meds","tab":"Medications","heading":"Medications","noun":"medication","statLabel":"Medications","counterLabel":"Medications listed","intro":"Every medication, including over-the-counter and vitamins — the single list a new provider, a pharmacist, and an emergency room all ask for first. Interactions hide in the ones people forget to mention, so include everything. Keep the stopped ones here rather than deleting them, and fill in the dates: after a hospital stay, the question is always what changed and when, and a list with no history cannot answer it.","columns":[{"key":"name","label":"Medication","width":"18%","sample":["Metformin","Lisinopril","Vitamin D","Aspirin — low dose"],"type":"text"},{"key":"dose","label":"Dose","width":"9%","sample":["500mg, twice daily","10mg, once daily","2000 IU, daily","81mg, daily"],"type":"text"},{"key":"schedule","label":"When","width":"15%","type":"list","options":["Morning","Midday","Evening","Bedtime","Twice daily","As needed","Weekly","Other"]},{"key":"prescriber","label":"Prescriber","width":"13%","sample":["Dr. Alvarez — primary care","Dr. Chen — cardiology","Dr. Alvarez — primary care","Dr. Osei — geriatrics"],"type":"text"},{"key":"started","label":"Started","width":"9%","type":"date"},{"key":"changed","label":"Last changed","width":"10%","type":"date"},{"key":"status","label":"Still taking?","width":"12%","type":"list","options":["Taking","As needed","Paused","Stopped","Changed at discharge"]},{"key":"purpose","label":"What it's for","sample":["Blood sugar","Blood pressure","Bone health","Heart"],"type":"text"}],"counter":"category","counterField":"status"},{"id":"health","tab":"Health Facts","heading":"Health Facts","noun":"fact","statLabel":"Health facts","counterLabel":"Facts recorded","intro":"The essentials an emergency room or a new provider asks for in the first minutes: conditions, allergies, blood type, the equipment they use, how they move and eat, and where the insurance card and advance directive live. The card and the directive matter by their location, not their numbers. Keep this tab short — it is the one someone reads standing up.","columns":[{"key":"item","label":"Fact","width":"28%","type":"list","options":["Health condition","Drug allergy","Other allergy","Blood type","Equipment / device","Mobility or transfer needs","Dietary restriction","Vision, hearing, or communication","Preferred hospital","Insurance / Medicare card location","Advance directive / POLST location","Other"]},{"key":"value","label":"Details","width":"44%","sample":["Type 2 diabetes","Penicillin","Shellfish","O positive"],"type":"text"},{"key":"notes","label":"Notes","type":"text"}],"counter":"count"},{"id":"team","tab":"Care Team","heading":"Care Team","noun":"person","nounPlural":"people","statLabel":"Care team","counterLabel":"People listed","intro":"Everyone who keeps this person well: the primary doctor, specialists, pharmacy, any home health support, and the family who help. The first rows are the first calls when something changes.","columns":[{"key":"name","label":"Name","width":"17%","type":"text"},{"key":"role","label":"Role","width":"21%","type":"list","options":["Primary doctor","Specialist","Pharmacy","Home health / aide","Care manager","Family caregiver","Emergency contact","Backup caregiver","Other"]},{"key":"phone","label":"Phone","width":"13%","type":"text"},{"key":"email","label":"Email","width":"15%","type":"text"},{"key":"bestWay","label":"Best way to reach","width":"16%","type":"list","options":["Direct line","Front desk","Patient portal message","After-hours line","Email","Text","Through the agency","Not sure yet"]},{"key":"notes","label":"Notes / what they cover","type":"text"}],"counter":"count"},{"id":"visits","tab":"Appointments","heading":"Appointments & Visit Notes","noun":"appointment","statLabel":"Appointments","counterLabel":"Appointments recorded","intro":"One row per visit: who was seen, what came out of it, and what happens next. Six months on, nobody remembers which appointment the dose changed at or which specialist asked for the blood work — this tab does. It is also what lets a sibling who wasn't in the room catch up in a minute instead of a phone call.","columns":[{"key":"date","label":"Date","width":"10%","type":"date"},{"key":"who","label":"Who they saw","width":"17%","type":"list","options":["Primary doctor","Specialist","Lab or imaging","Therapy or rehab","Dentist or vision","Emergency room","Home health","Telehealth","Other"]},{"key":"reason","label":"Why","width":"17%","sample":["Annual checkup","Follow-up on blood work","Cardiology follow-up","Medication review"],"type":"text"},{"key":"whatChanged","label":"What changed","width":"22%","sample":["Blood pressure medication adjusted","Ordered new labs","No changes","Referred to a specialist"],"type":"text"},{"key":"nextStep","label":"Next step","width":"18%","sample":["Follow up in 3 months","Repeat labs in 6 weeks","None needed","Schedule specialist visit"],"type":"text"},{"key":"nextDate","label":"Next date","width":"10%","type":"date"},{"key":"whoWent","label":"Who went","sample":["Me","My sister","Me","Home health aide"],"type":"text"}],"counter":"count"},{"id":"stays","tab":"Hospital Stays","heading":"Hospital Stays & Discharge","noun":"stay","statLabel":"Hospital stays","counterLabel":"Stays recorded","intro":"Discharge is where the medication list and reality drift apart: instructions change, something is added, something else quietly stops, and the person carrying it home is the one expected to keep up. Record each stay, then use the last column to mark whether the Medications tab has actually been checked against the discharge papers yet. The unchecked ones are the ones worth an evening.","columns":[{"key":"admitted","label":"Admitted","width":"11%","type":"date","sample":["2026-01-08","2026-02-09","2026-03-10","2026-04-11"]},{"key":"discharged","label":"Discharged","width":"11%","type":"date","sample":["2026-01-10","2026-02-11","2026-03-12","2026-04-13"]},{"key":"where","label":"Where","width":"16%","sample":["Memorial Hospital","St. Vincent's","Regional Medical Center","Memorial Hospital"],"type":"text"},{"key":"why","label":"What happened","width":"22%","sample":["Fall at home","Pneumonia","Dehydration","Scheduled surgery"],"type":"text"},{"key":"dischargedTo","label":"Discharged to","width":"16%","type":"list","options":["Home","Home with home health","Rehab or skilled nursing","Assisted living","Another hospital","Other"]},{"key":"medsChecked","label":"Medications checked?","width":"16%","type":"list","options":["Checked against the discharge papers","Not checked yet","Nothing changed","Unknown"]},{"key":"notes","label":"Notes","type":"text"}],"counter":"category","counterField":"medsChecked"},{"id":"changes","tab":"What's Changed","heading":"What's Changed","noun":"entry","nounPlural":"entries","statLabel":"Changes noted","counterLabel":"Entries","intro":"A dated record of what you noticed, in plain words — nothing more. A fall, a confused afternoon, a week off their food, a stretch of good days worth remembering. This tab does not rate anything, score anything, or tell you what any of it means: that is the treating clinician's work, and they can only do it if someone wrote down what happened and when. The pattern across months is the part nobody can reconstruct from memory in a fifteen-minute appointment.","columns":[{"key":"date","label":"Date","width":"10%","type":"date"},{"key":"what","label":"What you noticed","width":"20%","type":"list","options":["Fall","Near-fall or unsteadiness","Confusion or disorientation","Wandering","Sleep change","Appetite or weight change","Mood or behaviour change","Pain mentioned","Skin or wound","Something new","A good day worth noting","Other"]},{"key":"detail","label":"What happened","width":"26%","sample":["Seemed more confused than usual","Skipped two meals","Fell getting out of bed","Slept most of the day"],"type":"text"},{"key":"context","label":"What was going on","width":"18%","sample":["After a new medication started","Hot weather, may not have been drinking enough","Rushing to the bathroom at night","Seemed like a cold coming on"],"type":"text"},{"key":"told","label":"Passed on?","width":"16%","type":"list","options":["Mentioned at an appointment","Left a message","Told the home health team","Not yet","Not needed"]},{"key":"notes","label":"Notes","type":"text"}],"counter":"category","counterField":"what"},{"id":"coverage","tab":"Who Covered What","heading":"Who Covered What","noun":"entry","nounPlural":"entries","statLabel":"Hours logged","counterLabel":"Entries logged","intro":"One line per visit, drive, errand, or overnight, with roughly how long it took. This is not a scoreboard and it is not evidence in an argument — it exists because caregiving is largely invisible work, and invisible work is the kind families end up disagreeing about. Written down as it happens, the week explains itself: who is carrying what, where the gaps are, and whether anyone has actually had a break. Log respite here too — time off only counts if it is as real as everyone else's hours.","columns":[{"key":"date","label":"Date","width":"11%","type":"date"},{"key":"who","label":"Who","width":"15%","sample":["Me","My brother","Paid aide","My sister"],"type":"text"},{"key":"what","label":"What they covered","width":"26%","type":"list","options":["Visit","Appointment — drove or attended","Medication or pharmacy run","Groceries or errands","Household or repairs","Phone calls or admin","Overnight or weekend stay","Arranged paid help","Respite — someone else covered","Other"]},{"key":"hours","label":"Hours","width":"10%","type":"num","format":"plain","sample":["3","2","4","6"]},{"key":"notes","label":"Notes","type":"text"}],"counter":"total","counterField":"hours","totalFormat":"plain","totalUnit":"hours logged","totalLabel":"Care hours logged","line":"Logged so far: {total}. Not a score — just the size of a job that is otherwise invisible."},{"id":"expenses","tab":"Care Expenses","heading":"Care Expenses","noun":"expense","statLabel":"Care expenses","counterLabel":"Expenses logged","intro":"Everything spent on their care, whoever paid for it: prescriptions, groceries, the fuel to get there, the grab rail, the aide's extra afternoon. It is rarely one big number — it is a hundred small ones nobody adds up, which is exactly why it becomes a grievance. Log the amount, who paid it, and whose money it came from; put anything already settled in the paid back column and the tab keeps the outstanding figure current on its own. Whether any of it is reimbursable, deductible, or countable somewhere is a question for an attorney or an accountant — keeping the record is this tab's job, not answering that.","columns":[{"key":"date","label":"Date","width":"9%","type":"date"},{"key":"what","label":"What it was","width":"17%","sample":["Grocery delivery","Prescription copay","Home health aide","Medical equipment"],"type":"text"},{"key":"category","label":"Category","width":"13%","type":"list","options":["Medical or dental","Prescriptions","Groceries and household","Home care or aide","Equipment or home modification","Transport and travel","Utilities, rent, or mortgage","Insurance premium","Legal or professional fees","Other"],"sample":["Groceries and household","Prescriptions","Home care or aide","Equipment or home modification"]},{"key":"amount","label":"Amount ($)","width":"9%","type":"num"},{"key":"paidBy","label":"Who paid","width":"10%","sample":["Me","My brother","Mom's account","Split with my sister"],"type":"text"},{"key":"paidFrom","label":"Whose money","width":"12%","type":"list","options":["My own money","A sibling's money","Their own money","Joint care fund","Split between us"]},{"key":"reimbursed","label":"Paid back ($)","width":"9%","type":"num"},{"key":"owed","label":"Outstanding","width":"9%","type":"calc","calc":["amount","reimbursed"],"op":"-"},{"key":"receipt","label":"Receipt","width":"8%","type":"list","options":["Have it","Need it","Not available"]},{"key":"notes","label":"Notes","type":"text"}],"counter":"total","counterField":"owed","totalLabel":"Still outstanding","line":"Still outstanding: {total}. One shared figure, so nobody has to work it out or ask for it."},{"id":"documents","tab":"Documents","heading":"Where the Documents Live","noun":"document","statLabel":"Documents located","counterLabel":"Documents located","intro":"Not the documents themselves and nothing inside them — just where each one is and who already has a copy. A hospital, a sibling, or a fill-in caregiver asks these questions at the worst possible moment, and the answer is almost never written down anywhere. Record the location, the date on it, and who else holds one.","columns":[{"key":"what","label":"Document","width":"26%","type":"list","options":["Power of attorney — financial","Healthcare proxy or medical POA","Advance directive or POLST","Will or trust","Guardianship or conservatorship papers","Long-term care insurance policy","Life insurance policy","Deed, lease, or mortgage","Medicare or insurance card","Pension or benefit paperwork","Where the bills are paid from","Tax records","The doctor's own answer on when to reach them","Other"]},{"key":"where","label":"Where it is","width":"24%","type":"text"},{"key":"whoHasCopy","label":"Who else has a copy","width":"20%","sample":["Me","My sister","Attorney","Not shared yet"],"type":"text"},{"key":"dated","label":"Dated","width":"11%","type":"date"},{"key":"notes","label":"Notes","type":"text"}],"counter":"count"}],"wishesEnabled":true,"wishes":{"tab":"Care Wishes","heading":"Care Wishes & Preferences","intro":"The person, not just the patient. How they like their day, the foods and comforts that help, what matters to them, and — gently — what they'd want if bigger choices arise. None of this is binding; it simply means whoever steps in cares for them the way they'd want, not the way a stranger would guess. The last box is for you rather than them, and it stays off every printed sheet.","disclaimer":"These are preferences to guide caregivers, not medical or legal instructions. Formal healthcare decisions belong in an advance directive; note where that document lives in the Health Facts tab.","items":[{"key":"day","label":"How they like their day","prompt":"Wake and sleep times, routines, the rhythm that keeps them steady. What a good day looks like."},{"key":"food","label":"Food & comfort","prompt":"Favorite foods and drinks, what they won't touch, and the small comforts — a blanket, a show, a walk — that help on a hard day."},{"key":"matters","label":"What matters to them","prompt":"Faith, family, independence, a pet, staying in their own home. The things worth protecting as care increases."},{"key":"soothes","label":"What soothes or upsets","prompt":"For a fill-in caregiver especially: what calms them, and what to avoid. Names, topics, times of day."},{"key":"wishes","label":"Wishes if choices arise","prompt":"Optional and gentle. Anything they've said about care, hospitals, or the kind of help they'd want. Where their advance directive lives, if there is one."},{"key":"mine","label":"For you — what you need to keep doing this","prompt":"Private to this file; it prints on none of the sheets. What makes a week workable, what you have quietly stopped doing, who you would call if you couldn't get out of bed tomorrow. There is no advice here and nothing to live up to — this is a place to write it down, because the plan assumes you are well and it is worth noticing when you aren't."}]},"sheet":null,"sheets":[{"tab":"ER Sheet","heading":"Emergency Room Sheet","button":"Print the ER Sheet","intro":"The page someone reads standing up. Conditions and allergies, every medication, and who to call — nothing else, so nothing important is buried. Keep a printed copy on the fridge, in the go-bag, and with the medications.","docTitle":"What an Emergency Room Needs to Know","docTag":"An ER Sheet · prepared with the Quietkeep Caregiving Companion","lead":"This sheet holds what a hospital or a new clinician needs in the first minutes: conditions and allergies, the medications currently taken, who is on the care team, and where the insurance card and advance directive are kept. It is an organizer output — not medical advice, and not a substitute for the treating clinician.","foot":"Prepared by their caregiver. This sheet is an organizer output, not medical advice and not a care plan from a licensed professional. It records information; it does not diagnose or dose. It contains no insurance or account numbers. For medical decisions, consult the treating clinician.","disclaimer":"An information sheet for caregivers and clinicians, not a medical or legal document. For formal healthcare choices, see the advance directive.","sections":[{"type":"register","id":"health","title":"Conditions, Allergies & Where Documents Live"},{"type":"register","id":"meds","title":"Current Medications"},{"type":"register","id":"team","title":"Care Team & Who to Call"}]},{"tab":"Fill-In Sheet","heading":"Fill-In Caregiver Sheet","button":"Print the Fill-In Sheet","intro":"For anyone covering — a sibling for a weekend, an aide on their first day. It compiles the routine, the medications, the care team, and what soothes or upsets them, so someone new can be useful within the hour instead of asking questions all day.","docTitle":"What a Fill-In Caregiver Needs to Know","docTag":"A Fill-In Caregiver Sheet · prepared with the Quietkeep Caregiving Companion","lead":"This sheet is for whoever is stepping in. It holds the rhythm of a normal day, the medications and when they are taken, who to call, and the preferences that make the difference between being cared for and being handled. It is an organizer output, not medical advice.","foot":"Prepared by their usual caregiver. This sheet records preferences and information so someone new can help; it does not diagnose or dose, and it contains no insurance or account numbers. For medical decisions, consult the treating clinician.","disclaimer":"Preferences to guide a caregiver, not medical or legal instructions. Formal healthcare decisions belong in the advance directive.","sections":[{"type":"wish","key":"day","title":"How They Like Their Day","empty":"Not recorded yet — the routine that keeps them steady."},{"type":"register","id":"meds","title":"Medications & When They're Taken"},{"type":"register","id":"team","title":"Who to Call"},{"type":"wishes","title":"What Helps, and What Doesn't","exclude":["day","mine"]}]},{"tab":"Family Summary","heading":"Family Summary","button":"Print the Family Summary","intro":"The monthly page for everyone else. Hours covered and by whom, what has been spent and what is still outstanding, the appointments since last time, and any hospital stay. Sent on the same day each month it settles the two questions families actually argue about, before either becomes an argument.","docTitle":"Care Summary for the Family","docTag":"A Family Summary · prepared with the Quietkeep Caregiving Companion","lead":"A shared picture of the month: who covered what and for how long, what care has cost and who paid for it, what is still outstanding, and what happened medically. It is a record, not an invoice and not a scorecard — it exists so everyone is looking at the same page.","foot":"Prepared by their caregiver. This summary records hours logged and money spent on care. Whether any of it is reimbursable, deductible, or countable anywhere is a question for an attorney or an accountant; this sheet does not answer it.","disclaimer":"A shared record for the family, not an invoice, a legal claim, or a measure of anyone.","sections":[{"type":"register","id":"coverage","title":"Who Covered What"},{"type":"register","id":"expenses","title":"Care Expenses & What's Outstanding"},{"type":"register","id":"visits","title":"Appointments"},{"type":"register","id":"stays","title":"Hospital Stays"}]}],"summary":{"disclaimer":"The Caregiving Companion is an organizer. It is not medical advice and not a professional care plan — it records information so the right people can act, and it never diagnoses or doses. It never asks for an insurance, Medicare, or account number. Everything you enter stays in this file's storage on your device and is never transmitted anywhere.","intro":"See where the plan stands, keep it current, and back up your work to a file you control. The totals below are the ones worth watching: hours logged, and what is still outstanding between everyone.","reviewNote":"Care changes fastest after a hospital stay or a new diagnosis. Mark today as reviewed after any pass, and especially after a discharge or a medication change — the Hospital Stays tab tracks which ones you have checked the medication list against.","staleFlag":"It has been more than a few months since your last review. Medications and needs drift — open the Summary tab when you have a few quiet minutes."},"safety":{"title":"Before you start","body":["Keep this somewhere only you can reach — a device, phone, or USB drive that isn't shared. If you are worried about someone in your household finding it, use a device only you can get to, or a computer at a library.","This is an organizer. It is not legal, medical, or financial advice, and it is not a substitute for the advice of an attorney."],"hotline":["If you are in danger, your safety comes before any of this:","National Domestic Violence Hotline — 1-800-799-7233","Text START to 88788","Deaf/HoH video phone — 855-812-1001"],"fine":"This is an organizer, not medical advice and not a care plan from a licensed professional. It records information so the right people can act; it does not diagnose or dose. For medical decisions, consult the treating clinician."},"legacyTasks":null};
const PHASES=CONFIG.phases;
const REGISTERS=CONFIG.registers||[];
const WISHES=(CONFIG.wishes&&CONFIG.wishes.items)||[];
const STORAGE_KEY=CONFIG.storageKey;
const SAFETY=CONFIG.safety||{};
/* A product may declare several printable outputs (`sheets`) rather than one.
   Special Needs needs this for a real reason, not tidiness: a single packet
   that compiles benefits status AND guardianship wishes is right for a future
   guardian and wrong to hand a third-grade teacher. `sheet` stays supported so
   the ten products built before this keep generating byte-identical output. */
const SHEETS=(CONFIG.sheets&&CONFIG.sheets.length)?CONFIG.sheets:(CONFIG.sheet?[CONFIG.sheet]:[]);

/* ---------- task identity ----------
   Task completion used to be stored by POSITION ("p0t3"). That meant inserting
   a task in the middle of a phase silently moved every tick below it onto a
   different task — a buyer saw work marked done that they had never done, and
   lost credit for work they had. On products whose whole promise is "nothing
   important gets missed", that is worse than losing the data outright.

   Keys are now a slug of the task title, which survives reordering, insertion
   and deletion. Verified unique within every product in the catalogue.
   `migrateTaskKeys()` converts an existing buyer's positional ticks exactly
   once, using the task order as it stood when they saved. */
function slugKey(s){
  return String(s == null ? "" : s).toLowerCase()
    .replace(/[^a-z0-9]+/g, "-").replace(/-+/g, "-")
    .replace(/^-|-$/g, "").slice(0, 48);
}

function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function nl2br(s){return esc(s).replace(/\n/g,"<br>");}
function nonEmpty(v){return v!==undefined&&v!==null&&String(v).trim()!=="";}
function money(n){return "$"+(Math.round(n*100)/100).toLocaleString("en-US",{minimumFractionDigits:0,maximumFractionDigits:2});}
function plain(n){return (Math.round(n*100)/100).toLocaleString("en-US");}
/* Totals are money by default — the estate and divorce lines all count dollars.
   Some registers count minutes or plain units instead (service delivery, for
   one), so a register may set totalFormat:"plain" with totalUnit:"minutes". */
function fmtTotal(reg,n){
  return reg.totalFormat==="plain"
    ? plain(n)+(reg.totalUnit?" "+reg.totalUnit:"")
    : money(n);
}
function fmtCell(col,v){
  if(col.format==="plain")return plain(parseFloat(v)||0);
  return money(parseFloat(v)||0);
}
/* A "calc" column is derived and never stored: calc:["a","b"] with op "*" or
   "-". It keeps the arithmetic a buyer would otherwise do by hand — quantity
   x cost-each, or actual minus normal — inside the engine, where it stays
   correct as rows change instead of going stale the moment anything is edited. */
function calcVal(reg,row,col){
  const a=(col.calc||[])[0],b=(col.calc||[])[1];
  const x=parseFloat(row[a])||0,y=parseFloat(row[b])||0;
  return col.op==="-"?(x-y):(x*y);
}
function cellVal(reg,row,col){return col.type==="calc"?calcVal(reg,row,col):row[col.key];}
function regById(id){return REGISTERS.find(r=>r.id===id);}
function colByKey(reg,key){return reg.columns.find(c=>c.key===key);}
function numKey(reg){const c=reg.columns.find(c=>c.type==="num");return c?c.key:null;}

/* ---------- state ---------- */
let state=null;
/* Stable per-task keys, computed once from the current phase order. */
const TASK_KEYS=PHASES.map(ph=>(ph.tasks||[]).map(t=>slugKey(t[0])));

/* Convert positional task ticks to stable keys, once, on first open of an
   updated file. `legacyTasks` is the task order AS THE BUYER HAS IT — needed
   only when a release reorders tasks in the same version that introduces this
   migration. Otherwise the current order is the buyer's order, so it is the
   correct fallback and the migration is exact. */
function migrateTaskKeys(){
  if(state.tkv>=2){return;}
  const legacy=CONFIG.legacyTasks||PHASES.map(ph=>(ph.tasks||[]).map(t=>t[0]));
  const out={};
  (legacy||[]).forEach((ph,pi)=>(ph||[]).forEach((title,ti)=>{
    if(state.tasks&&state.tasks["p"+pi+"t"+ti])out[slugKey(title)]=true;
  }));
  /* Preserve any keys that are already slugs — a re-restored backup, or a file
     opened by a newer build first. Never drop a tick we cannot explain. */
  Object.keys(state.tasks||{}).forEach(k=>{
    if(!/^p\d+t\d+$/.test(k)&&state.tasks[k])out[k]=true;
  });
  state.tasks=out;
  state.tkv=2;
}

function defaultState(){
  const d={v:1,tkv:2,tasks:{},wishes:{},lastReviewed:null};
  REGISTERS.forEach(r=>{d[r.id]=[];});
  return d;
}
function load(){
  try{const raw=localStorage.getItem(STORAGE_KEY);state=raw?JSON.parse(raw):defaultState();}
  catch(e){state=defaultState();}
  REGISTERS.forEach(r=>{if(!Array.isArray(state[r.id]))state[r.id]=[];});
  if(typeof state.tasks!=="object"||!state.tasks)state.tasks={};
  if(typeof state.wishes!=="object"||!state.wishes)state.wishes={};
  if(state.lastReviewed===undefined)state.lastReviewed=null;
  migrateTaskKeys();
}
function save(){
  try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state));
    document.getElementById("save-status").innerHTML="<b>All changes saved on this device</b>";}
  catch(e){document.getElementById("save-status").innerHTML="<b>Could not save — download a backup from the Summary tab</b>";}
}

/* ---------- shell: nav + sections built from CONFIG ---------- */
function buildShell(){
  const nav=document.getElementById("nav");
  const wrap=document.getElementById("sections");
  const tabs=[{id:"tasks",label:CONFIG.tasks.tab||"Tasks"}];
  REGISTERS.forEach(r=>tabs.push({id:r.id,label:r.tab}));
  if(CONFIG.wishesEnabled)tabs.push({id:"wishes",label:CONFIG.wishes.tab||"Wishes"});
  SHEETS.forEach((s,i)=>tabs.push({id:"sheet"+i,label:s.tab||"Instruction Sheet"}));
  tabs.push({id:"summary",label:"Summary & Backup"});
  tabs.forEach((t,i)=>{
    const b=document.createElement("button");
    b.dataset.tab=t.id;b.textContent=t.label;if(i===0)b.className="active";
    nav.appendChild(b);
  });

  let h="";
  // Tasks
  h+='<section class="tab active" id="tab-tasks"><h2>'+esc(CONFIG.tasks.heading||"Guided Tasks")+'</h2>'+
     '<p class="note">'+esc(CONFIG.tasks.intro||"")+'</p><div id="phases"></div>'+
     (CONFIG.tasks.disclaimer?'<p class="disclaimer">'+esc(CONFIG.tasks.disclaimer)+'</p>':"")+
     '</section>';
  // Registers
  REGISTERS.forEach(r=>{
    /* A register may carry a `warn` — one prominent, red, shown-once line under
       the intro. Wishes already had this; registers did not, so a prohibition
       as load-bearing as "never the codes themselves" could only be muted grey
       prose. Deliberately register-level, not per-column: a warning repeated on
       every row of a table stops being read by row three. */
    h+='<section class="tab" id="tab-'+esc(r.id)+'"><h2>'+esc(r.heading)+'</h2>'+
       '<p class="note">'+esc(r.intro||"")+'</p>'+
       (r.warn?'<p class="warnline">'+esc(r.warn)+'</p>':"")+
       // A many-column register needs real pixel width to stay legible — 70px
       // per column is roughly what a narrow text/number input needs, so a
       // 13-column table gets ~910px minimum rather than being crushed into
       // whatever fraction of 1040px is left after padding.
       // 70px/column still clipped a 2-digit number input to its first digit
       // (spinner arrows + input padding eat more of a narrow cell than the
       // math suggested) — verified by looking at the actual render, not by
       // recomputing the math a second time. 85px holds up on inspection.
       '<div class="table-wrap"><table style="min-width:'+(85*(r.columns.length+1))+'px"><thead><tr>';
    r.columns.forEach(c=>{h+='<th'+(c.width?' style="width:'+esc(c.width)+'"':"")+'>'+esc(c.label)+'</th>';});
    h+='<th style="width:36px"></th></tr></thead><tbody id="'+esc(r.id)+'-body"></tbody></table></div>'+
       '<button class="add" data-add="'+esc(r.id)+'">+ Add '+esc(r.noun||"row")+'</button>';
    if(r.counter&&r.counter!=="none")h+='<div class="totals" id="'+esc(r.id)+'-total"></div>';
    if(r.counter==="total"&&r.line)h+='<p class="note" id="'+esc(r.id)+'-line" style="margin-top:6px"></p>';
    if(r.disclaimer)h+='<p class="disclaimer">'+esc(r.disclaimer)+'</p>';
    h+='</section>';
  });
  // Wishes
  if(CONFIG.wishesEnabled){
    h+='<section class="tab" id="tab-wishes"><h2>'+esc(CONFIG.wishes.heading||"Wishes & Instructions")+'</h2>'+
       '<p class="note">'+esc(CONFIG.wishes.intro||"")+'</p><div id="wishes-body"></div>'+
       (CONFIG.wishes.disclaimer?'<p class="disclaimer">'+esc(CONFIG.wishes.disclaimer)+'</p>':"")+
       '</section>';
  }
  // Sheet
  SHEETS.forEach((S,i)=>{
    h+='<section class="tab" id="tab-sheet'+i+'"><h2>'+esc(S.heading)+'</h2>'+
       '<p class="note">'+esc(S.intro||"")+'</p>'+
       '<div id="sheet-preview-'+i+'" class="review-box"></div>'+
       '<div class="toolbar"><button class="primary" onclick="printSheet('+i+')">'+esc(S.button||"Print the Instruction Sheet")+'</button></div>'+
       (S.disclaimer?'<p class="disclaimer">'+esc(S.disclaimer)+'</p>':"")+
       '</section>';
  });
  // Summary
  h+='<section class="tab" id="tab-summary"><h2>Summary &amp; Backup</h2>'+
     '<p class="note">'+esc(CONFIG.summary.intro||"See where you stand, keep this current, and back up your work to a file you control.")+'</p>'+
     '<div id="summary-stats"></div>'+
     '<div class="review-box"><div class="rl" id="review-line">Last reviewed: <strong>not yet reviewed</strong></div>'+
     '<p class="note" style="margin:6px 0 10px">'+esc(CONFIG.summary.reviewNote||"Mark today as reviewed after any pass, and again after anything meaningful changes.")+'</p>'+
     '<div class="toolbar" style="margin-top:0"><button class="primary" onclick="markReviewed()">Mark reviewed today</button></div></div>'+
     '<div class="toolbar">'+
     SHEETS.map((S,i)=>'<button onclick="printSheet('+i+')">'+esc(S.button||"Print the Instruction Sheet")+'</button>').join("")+
     '<button onclick="printAll()">Print everything (all registers)</button>'+
     '<button onclick="backup()">Download backup file</button>'+
     '<button onclick="document.getElementById(\'restore-file\').click()">Restore from backup</button>'+
     '<input type="file" id="restore-file" accept=".json" style="display:none" onchange="restore(this)">'+
     '</div>'+
     (CONFIG.summary.disclaimer?'<p class="disclaimer">'+esc(CONFIG.summary.disclaimer)+'</p>':"")+

/* ---------- task engine ---------- */
function renderTasks(){

      const row=document.createElement("div");row.className="task"+(checked?" done":"");
      const cb=document.createElement("input");cb.type="checkbox";cb.checked=checked;

function taskCounts(){let total=0,done=0;PHASES.forEach((ph,pi)=>ph.tasks.forEach((t,ti)=>{total++;if(state.tasks[TASK_KEYS[pi][ti]])done++;}));return{total,done};}
function updateProgress(){
  let total=0,done=0;
  document.querySelectorAll("#phases .phase").forEach((div)=>{
    let pDone=0;const boxes=div.querySelectorAll(".task input[type=checkbox]");
    boxes.forEach(b=>{total++;if(b.checked){done++;pDone++;}});
    div.querySelector(".bar>div").style.width=Math.round(pDone/boxes.length*100)+"%";
  });
  const pct=total?Math.round(done/total*100):0;

/* ---------- register engine ---------- */
function fieldEl(reg,row,col){
  const td=document.createElement("td");
  /* Derived cells are output, not input — render as read-only text so nobody
     types into a number that is about to be recomputed. refreshCalc() keeps
     them current as the columns they depend on are edited. */
  if(col.type==="calc"){
    td.className="num";
    td.textContent=fmtCell(col,calcVal(reg,row,col));
    return td;
  }
  let el;
  if(col.type==="select"){el=document.createElement("select");
    (col.options||[]).forEach(o=>{const op=document.createElement("option");op.value=o;op.textContent=o;el.appendChild(op);});
    el.value=row[col.key]||(col.options||[""])[0];}
  else if(col.type==="list"){el=document.createElement("input");el.type="text";
    const dl=document.createElement("datalist");const dlid="dl-"+reg.id+"-"+col.key+"-"+Math.random().toString(36).slice(2,8);
    dl.id=dlid;(col.options||[]).forEach(o=>{const op=document.createElement("option");op.value=o;dl.appendChild(op);});
    el.setAttribute("list",dlid);td.appendChild(dl);
    el.value=row[col.key]!==undefined?row[col.key]:"";}
  else{el=document.createElement("input");el.type=col.type==="num"?"number":(col.type==="date"?"date":"text");
    if(col.type==="num"){el.step="0.01";td.className="num";}
    el.value=row[col.key]!==undefined?row[col.key]:"";}
  el.addEventListener("input",()=>{row[col.key]=el.value;save();totals();});
  el.addEventListener("change",()=>{row[col.key]=el.value;save();totals();});
  td.appendChild(el);return td;
}
function renderTable(id){
  const reg=regById(id);
  const body=document.getElementById(id+"-body");body.innerHTML="";
  state[id].forEach((row,i)=>{
    const tr=document.createElement("tr");
    reg.columns.forEach(c=>tr.appendChild(fieldEl(reg,row,c)));
    const td=document.createElement("td");
    const del=document.createElement("button");del.className="del";del.textContent="✕";del.title="Remove row";
    del.addEventListener("click",()=>{if(confirm("Remove this row?")){state[id].splice(i,1);save();renderTable(id);totals();}});
    td.appendChild(del);tr.appendChild(td);body.appendChild(tr);
  });
}
function addRow(id){state[id].push({});save();renderTable(id);totals();}
function categoryCounts(reg){
  const field=reg.counterField;const cats=(colByKey(reg,field)||{}).options||[];
  const counts={};
  state[reg.id].forEach(r=>{const c=cats.indexOf(r[field])>=0?r[field]:(r[field]||cats[0]);counts[c]=(counts[c]||0)+1;});
  return counts;
}
function regTotal(reg){
  const k=reg.counterField||numKey(reg);
  const col=colByKey(reg,k);
  if(col&&col.type==="calc")return state[reg.id].reduce((s,r)=>s+calcVal(reg,r,col),0);
  return state[reg.id].reduce((s,r)=>s+(parseFloat(r[k])||0),0);
}
/* Repaint derived cells in place. Re-rendering the whole table would steal
   focus from the field being typed into, which is why this updates the td
   text directly rather than calling renderTable(). */
function refreshCalc(){
  REGISTERS.forEach(reg=>{
    if(!reg.columns.some(c=>c.type==="calc"))return;
    const body=document.getElementById(reg.id+"-body");if(!body)return;
    Array.prototype.forEach.call(body.rows,(tr,i)=>{
      const row=state[reg.id][i];if(!row)return;
      reg.columns.forEach((c,ci)=>{
        if(c.type!=="calc")return;
        const td=tr.cells[ci];if(td)td.textContent=fmtCell(c,calcVal(reg,row,c));
      });
    });
  });
}
function totals(){
  refreshCalc();
  REGISTERS.forEach(reg=>{
    const el=document.getElementById(reg.id+"-total");
    const noun=reg.noun||"row";const plural=reg.nounPlural||noun+"s";
    const label=reg.counterLabel||((plural.charAt(0).toUpperCase()+plural.slice(1))+" recorded");
    if(reg.counter==="category"&&el){
      const cats=(colByKey(reg,reg.counterField)||{}).options||[];
      const counts=categoryCounts(reg);
      const bits=cats.filter(c=>counts[c]).map(c=>c+" <strong>"+counts[c]+"</strong>");
      const extra=Object.keys(counts).filter(c=>cats.indexOf(c)<0).map(c=>c+" <strong>"+counts[c]+"</strong>");
      el.innerHTML=label+": <strong>"+state[reg.id].length+"</strong>"+(bits.length||extra.length?" · "+bits.concat(extra).join(" · "):"");
    }else if(reg.counter==="total"&&el){
      const n=state[reg.id].length;
      el.innerHTML=(reg.totalLabel||"Total")+": <strong>"+fmtTotal(reg,regTotal(reg))+"</strong><span class=\"pill\">"+n+" "+(n===1?noun:plural)+"</span>";
      const line=document.getElementById(reg.id+"-line");
      if(line)line.textContent=n?reg.line.replace("{total}",fmtTotal(reg,regTotal(reg))).replace("{n}",n):"";
    }else if(el){
      el.innerHTML=label+": <strong>"+state[reg.id].length+"</strong>";
    }
  });
  summaryStats();renderSheetPreview();
}

function summaryStats(){

function daysSince(iso){if(!iso)return null;const then=new Date(iso+"T00:00:00");const now=new Date();return Math.floor((now-then)/86400000);}
function renderReviewLine(){
  const line=document.getElementById("review-line");

/* ---------- print sheet (compiled from CONFIG.sheet.sections) ---------- */
function registerTableHTML(reg,rows,skipKey){
  let h='<table><tr>';
  reg.columns.forEach(c=>{if(c.key!==skipKey)h+='<th>'+esc(c.label)+'</th>';});
  h+='</tr>';
  rows.forEach(r=>{h+='<tr>';
    reg.columns.forEach(c=>{if(c.key===skipKey)return;
      const v=(c.type==="num"||c.type==="calc")?fmtCell(c,cellVal(reg,r,c)):esc(r[c.key]);
      h+='<td>'+v+'</td>';});
    h+='</tr>';});
  if(reg.counter==="total"){
    h+='<tr><td><strong>'+esc(reg.totalLabel||"Total")+'</strong>';
    const nk=reg.counterField||numKey(reg);
    reg.columns.forEach(c=>{if(c.key===skipKey||c.key===reg.columns[0].key)return;
      h+=c.key===nk?'<td><strong>'+fmtTotal(reg,regTotal(reg))+'</strong></td>':'<td></td>';});
    h=h.replace(/<td><\/td>$/,'<td colspan="1"></td>');
    h+='</tr>';
  }
  return h+'</table>';
}
function sheetHTML(idx){
  const S=SHEETS[idx||0]||{};
  let h='<h1>'+esc(S.docTitle)+'</h1><div class="ph">'+esc(S.docTag)+' &middot; '+new Date().toLocaleDateString()+'</div>';
  if(S.lead)h+='<p class="lead">'+esc(S.lead)+'</p>';
  (S.sections||[]).forEach(sec=>{
    h+='<h2>'+esc(sec.title)+'</h2>';
    if(sec.type==="wish"){
      const v=state.wishes[sec.key];
      if(nonEmpty(v))h+='<div class="wblock">'+nl2br(v)+'</div>';
      else h+='<p>'+esc(sec.empty||"Not recorded yet.")+'</p>';
    }else if(sec.type==="register"){
      const reg=regById(sec.id);const rows=state[sec.id];
      if(!rows.length){h+='<p>'+esc(sec.empty||("No "+(reg.nounPlural||((reg.noun||"row")+"s"))+" recorded yet."))+'</p>';return;}
      if(sec.groupBy){
        const cats=(colByKey(reg,sec.groupBy)||{}).options||[];
        /* Grouping by a column that has no `options` (a date, or free text) is
           legitimate — but then cats is empty, and a blank cell used to fall
           through to cats[0] === undefined and print "undefined (3)" as a
           heading on the buyer's printed sheet. Bucket those explicitly. */
        const counts={};rows.forEach(r=>{const c=cats.indexOf(r[sec.groupBy])>=0?r[sec.groupBy]:(r[sec.groupBy]||cats[0]||"Not recorded");counts[c]=(counts[c]||0)+1;});
        const order=cats.filter(c=>counts[c]).concat(Object.keys(counts).filter(c=>cats.indexOf(c)<0));
        order.forEach(c=>{
          h+='<h3>'+esc(c)+' ('+counts[c]+')</h3>';
          h+=registerTableHTML(reg,rows.filter(r=>{const rc=cats.indexOf(r[sec.groupBy])>=0?r[sec.groupBy]:(r[sec.groupBy]||cats[0]||"Not recorded");return rc===c;}),sec.groupBy);
        });
      }else{
        h+=registerTableHTML(reg,rows,null);
      }
    }else if(sec.type==="wishes"){
      let any=false;const excl=sec.exclude||[];
      WISHES.forEach(w=>{if(excl.indexOf(w.key)>=0)return;const v=state.wishes[w.key];if(!nonEmpty(v))return;any=true;
        h+='<h3>'+esc(w.label)+'</h3><div class="wblock">'+nl2br(v)+'</div>';});
      if(!any)h+='<p>'+esc(sec.empty||"No wishes recorded yet.")+'</p>';
    }
  });
  if(S.foot)h+='<p class="foot">'+esc(S.foot)+'</p>';
  return h;
}
function renderSheetPreview(){
  SHEETS.forEach((S,i)=>{
    const el=document.getElementById("sheet-preview-"+i);if(!el)return;

       guardianship data it deliberately leaves out. */
    const ids=(S.sections||[]).filter(s=>s.type==="register").map(s=>s.id);
    const regs=ids.length?REGISTERS.filter(r=>ids.indexOf(r.id)>=0):REGISTERS;
    const bits=regs.map(reg=>{
      const noun=reg.noun||"row";const plural=reg.nounPlural||noun+"s";
      const n=state[reg.id].length;
      let s=n+" "+(n===1?noun:plural);
      if(reg.counter==="total")s+=" ("+fmtTotal(reg,regTotal(reg))+")";

}

/* ---------- safety notice + erase ----------
   Two facts every Quietkeep product must state plainly, because neither is
   obvious and both can hurt someone: (1) "local" is not "private" when the
   person you fear shares the device; (2) localStorage is keyed to the browser,
   NOT to the file — deleting the .html does not delete the entries. Products
   that need more (the divorce line) add an `app.safety` block to the manifest. */
const DEFAULT_STORAGE_TRUTH="Nothing you type is ever sent anywhere — it is saved only in this browser, on this device. That also means anyone who can use this device and this browser can open it. It is not encrypted and not password-protected.";
const DEFAULT_ERASE_TRUTH="Deleting this file does NOT erase what you have entered. Your entries are stored by the browser, not inside the file. To remove them, use the “Erase everything” button at the bottom of the screen.";

function showNotice(){
  document.getElementById("qk-notice-h").textContent=SAFETY.title||"Before you start";
  let h="";
  (SAFETY.body||[]).forEach(p=>{h+='<p>'+esc(p)+'</p>';});
  h+='<p>'+esc(SAFETY.storage||DEFAULT_STORAGE_TRUTH)+'</p>';
  h+='<p>'+esc(SAFETY.erase||DEFAULT_ERASE_TRUTH)+'</p>';
  if(SAFETY.hotline&&SAFETY.hotline.length){
    h+='<div class="hot">';
    SAFETY.hotline.forEach((l,i)=>{h+=(i?'<br>':'')+(i?'<b>'+esc(l)+'</b>':esc(l));});
    h+='</div>';
  }
  const fine=SAFETY.fine||CONFIG.summary.disclaimer||"";
  if(fine)h+='<div class="fine">'+esc(fine)+'</div>';
  document.getElementById("qk-notice-body").innerHTML=h;
  const v=document.getElementById("qk-veil");
  v.hidden=false;
  document.getElementById("qk-notice-ok").focus();
}
function dismissNotice(){document.getElementById("qk-veil").hidden=true;}

/* How much is actually at risk — a concrete number warns far better than
   "everything", and lets an empty file erase without ceremony. */
function countEntries(){
  let n=0;
  REGISTERS.forEach(r=>{(state[r.id]||[]).forEach(row=>{
    if(r.columns.some(c=>nonEmpty(row[c.key])))n++;
  });});
  Object.keys(state.wishes||{}).forEach(k=>{if(nonEmpty(state.wishes[k]))n++;});
  Object.keys(state.tasks||{}).forEach(k=>{if(state.tasks[k])n++;});
  return n;
}

function eraseAll(){
  const n=countEntries();
  if(n===0){alert("There is nothing saved to erase yet.");return;}
  const noun=n===1?"entry":"entries";
  /* Two steps on purpose. This button is always on screen, so one stray click
     must never be able to destroy someone's work — but it also has to stay fast
     enough to use when you need the screen clear right now. */
  if(!confirm("ERASE EVERYTHING?\n\n"
    +"This permanently deletes all "+n+" "+noun+" you have saved in this browser for "+CONFIG.name+".\n\n"
    +"THIS CANNOT BE UNDONE. There is no way to get it back afterwards.\n\n"
    +"It does NOT delete any backup file you have already downloaded, or anything you have printed.\n\n"
    +"If you want to keep a copy, press Cancel and use “Download backup file” on the Summary tab first."))return;
  if(!confirm("Last check.\n\nReally erase all "+n+" saved "+noun+" permanently?"))return;
  state=defaultState();
  renderAll();
  /* Remove AFTER re-rendering, so nothing can write the key back on the way out. */
  try{localStorage.removeItem(STORAGE_KEY);}catch(e){}
  document.getElementById("save-status").innerHTML="<b>Erased from this browser</b>";
  alert("Erased. Nothing from this organizer is left in this browser.\n\n"
    +"If you also downloaded a backup file or printed a copy, delete those separately.");
}

/* ---------- backup / restore ---------- */
function backup(){
  const blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"});
  const aEl=document.createElement("a");aEl.href=URL.createObjectURL(blob);
  aEl.download=CONFIG.backupPrefix+"-backup-"+new Date().toISOString().slice(0,10)+".json";
  document.body.appendChild(aEl);aEl.click();aEl.remove();
}
function restore(input){
  const f=input.files[0];if(!f)return;
  const reader=new FileReader();
  reader.onload=()=>{try{const data=JSON.parse(reader.result);
      if(!data||typeof data!=="object")throw 0;
      state=Object.assign(defaultState(),data);
      REGISTERS.forEach(r=>{if(!Array.isArray(state[r.id]))state[r.id]=[]});
      if(typeof state.wishes!=="object"||!state.wishes)state.wishes={};
      save();renderAll();alert("Backup restored.");}
    catch(e){alert("That file does not look like a valid backup.");}};
  reader.readAsText(f);input.value="";
}

/* ---------- boot ---------- */
