<style>
:root{
  --spruce:#24413B; --porcelain:#F1F0EB; --brass:#A5834B; --mist:#9DB4AC; --ink:#1F2724;
  --white:#FFFFFF; --line:#D8D6CE; --soft:#E7E5DD; --danger:#8A3B2E;
  --serif:Charter,'Bitstream Charter',Georgia,'Times New Roman',serif;
  --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--porcelain);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5}
header{background:var(--spruce);color:var(--porcelain);padding:18px 24px;display:flex;align-items:center;gap:14px;border-bottom:4px solid var(--brass)}
header .mark{flex:0 0 auto}
header h1{font-family:var(--serif);font-size:1.35rem;font-weight:bold;letter-spacing:.2px}
header .sub{font-size:.78rem;color:var(--mist);letter-spacing:.14em;text-transform:uppercase;margin-top:2px}
.wrap{max-width:1040px;margin:0 auto;padding:20px 18px 80px}
nav{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0}
nav button{font-family:var(--sans);font-size:.92rem;font-weight:600;padding:10px 16px;border:1.5px solid var(--spruce);border-radius:999px;background:var(--white);color:var(--spruce);cursor:pointer}
nav button.active{background:var(--spruce);color:var(--porcelain)}
nav button:hover{border-color:var(--brass)}
.bar{background:var(--soft);border-radius:8px;height:14px;overflow:hidden;margin:6px 0 2px}
.bar>div{background:var(--brass);height:100%;border-radius:8px;transition:width .3s}
.progress-label{font-size:.85rem;color:var(--spruce)}
.review-flag{background:#FBF3E2;border:1px solid var(--brass);border-radius:10px;padding:10px 14px;margin:12px 0 0;font-size:.9rem;color:#6b5525;display:none}
.review-flag.show{display:block}
section.tab{display:none;background:var(--white);border:1px solid var(--line);border-radius:14px;padding:22px}
section.tab.active{display:block}
h2{font-family:var(--serif);font-size:1.5rem;margin-bottom:6px}
h3{font-family:var(--serif);font-size:1.15rem;margin:22px 0 4px;color:var(--spruce)}
.note{font-size:.9rem;color:#5c6660;margin-bottom:14px}
.phase{margin-bottom:26px}
.task{display:flex;gap:12px;align-items:flex-start;padding:10px 8px;border-bottom:1px solid var(--soft)}
.task:last-child{border-bottom:none}
.task input[type=checkbox]{width:22px;height:22px;accent-color:var(--spruce);margin-top:3px;flex:0 0 auto;cursor:pointer}
.task .t{font-weight:600}
.task .why{font-size:.86rem;color:#5c6660;margin-top:2px}
.task.done .t{color:#7a827d;text-decoration:line-through}
table{width:100%;border-collapse:collapse;margin-top:10px}
th{font-size:.78rem;text-transform:uppercase;letter-spacing:.06em;color:var(--spruce);text-align:left;padding:8px 6px;border-bottom:2px solid var(--spruce)}
td{padding:6px 4px;border-bottom:1px solid var(--soft);vertical-align:middle}
td input,td select{width:100%;font-family:var(--sans);font-size:.92rem;padding:7px 8px;border:1px solid var(--line);border-radius:7px;background:#FCFBF8;color:var(--ink)}
td input:focus,td select:focus{outline:2px solid var(--brass);border-color:var(--brass)}
td.num input{text-align:right}
.del{background:none;border:none;color:var(--danger);font-size:1.05rem;cursor:pointer;padding:4px 8px}
.add{margin-top:12px;background:var(--spruce);color:var(--porcelain);border:none;border-radius:999px;padding:10px 18px;font-weight:600;font-size:.92rem;cursor:pointer}
.add:hover{background:#2E5249}
.totals{margin-top:12px;font-family:var(--serif);font-size:1.05rem;color:var(--spruce)}
.totals strong{color:var(--ink)}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
.toolbar button{border:1.5px solid var(--spruce);background:var(--white);color:var(--spruce);border-radius:999px;padding:10px 16px;font-weight:600;font-size:.9rem;cursor:pointer}
.toolbar button.primary{background:var(--spruce);color:var(--porcelain)}
.toolbar button:hover{border-color:var(--brass)}
.pill{display:inline-block;background:var(--soft);border-radius:999px;padding:2px 10px;font-size:.78rem;color:var(--spruce);margin-left:8px}
/* Wide registers (Home Inventory's 13-column inventory table is the worst
   case in the catalogue) squeeze every column to illegibility when forced
   into the 1040px wrap at width:100% — a number input's spinner arrows alone
   can eat a 5%-wide column, so the digit inside never renders at all. Give
   the table room to be its natural width and let the wrapper scroll instead
   of compressing. Found by actually looking at a screenshot, not by reading
   the column list. */
.table-wrap{overflow-x:auto;margin-top:10px}
.table-wrap table{margin-top:0}
.wish{margin:0 0 22px}
.wish label{display:block;font-family:var(--serif);font-size:1.12rem;color:var(--spruce);margin-bottom:2px}
.wish .prompt{font-size:.86rem;color:#5c6660;margin-bottom:8px}
.wish textarea{width:100%;min-height:110px;font-family:var(--sans);font-size:.95rem;line-height:1.5;padding:11px 12px;border:1px solid var(--line);border-radius:9px;background:#FCFBF8;color:var(--ink);resize:vertical}
.wish textarea:focus{outline:2px solid var(--brass);border-color:var(--brass)}
.warnline{font-size:.82rem;color:var(--danger);margin-top:6px;font-weight:600}
.savebar{position:fixed;bottom:0;left:0;right:0;background:var(--spruce);color:var(--mist);font-size:.82rem;padding:8px 18px;display:flex;justify-content:space-between;align-items:center}
.savebar b{color:var(--porcelain)}
.disclaimer{font-size:.8rem;color:#6a736d;margin-top:18px;border-top:1px solid var(--soft);padding-top:10px}
.review-box{background:#F7F6F1;border:1px solid var(--line);border-radius:11px;padding:16px 18px;margin:6px 0 16px}
.review-box .rl{font-family:var(--serif);font-size:1.05rem;color:var(--spruce)}
.review-box .rl strong{color:var(--ink)}
/* First-open notice: storage truth + erase truth + (per product) safety guidance.
   Shown on EVERY open, not just the first — a disclaimer that appears only at
   first start-up is exactly what sank the defence in UPLC v. Parsons Technology. */
.qk-veil{position:fixed;inset:0;background:rgba(31,39,36,.72);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px;overflow-y:auto}
.qk-veil[hidden]{display:none}
.qk-notice{background:var(--white);border:1px solid var(--line);border-radius:14px;max-width:640px;width:100%;padding:26px 28px;margin:auto}
.qk-notice h2{font-family:var(--serif);font-size:1.35rem;color:var(--spruce);margin-bottom:10px}
.qk-notice p{font-size:.92rem;color:#3f4945;margin-bottom:12px}
.qk-notice .hot{background:#FBF3E2;border:1px solid var(--brass);border-radius:10px;padding:12px 14px;font-size:.92rem;color:#5d4a20;margin-bottom:14px}
.qk-notice .hot b{color:var(--ink)}
.qk-notice .fine{font-size:.8rem;color:#6a736d;border-top:1px solid var(--soft);padding-top:10px;margin-bottom:16px}
.savebar .right{display:flex;align-items:center;gap:10px}
.savebar .erase{background:none;border:1px solid var(--mist);color:var(--porcelain);border-radius:999px;padding:4px 12px;font-size:.78rem;font-weight:600;cursor:pointer}
.savebar .erase:hover{background:var(--danger);border-color:var(--danger)}
#print-area{display:none}
@media print{
  body *{visibility:hidden}
  #print-area,#print-area *{visibility:visible}
  #print-area{display:block;position:absolute;top:0;left:0;width:100%;font-family:var(--serif);color:#000}
  #print-area h1{font-size:22pt;margin-bottom:2pt}
  #print-area .ph{font-size:9pt;letter-spacing:.14em;text-transform:uppercase;margin-bottom:14pt;color:#333}
  #print-area h2{font-size:13pt;margin:16pt 0 4pt;border-bottom:1pt solid #000;padding-bottom:2pt}
  #print-area h3{font-size:11pt;margin:10pt 0 2pt}
  #print-area table{width:100%;border-collapse:collapse;font-size:10pt;margin-top:4pt}
  #print-area th,#print-area td{border-bottom:.5pt solid #999;padding:3pt 4pt;text-align:left;vertical-align:top}
  #print-area p{font-size:10pt;margin:4pt 0}
  #print-area .lead{font-size:11pt;margin:6pt 0 10pt}
  #print-area .wblock{font-size:10.5pt;margin:2pt 0 10pt;white-space:pre-wrap}
  #print-area .foot{font-size:8.5pt;color:#333;margin-top:14pt;border-top:.5pt solid #999;padding-top:6pt}
}
@media(max-width:640px){
  .wrap{padding:14px 10px 90px}
  section.tab{padding:14px}
  th,td{font-size:.85rem}
}
</style>

"use strict";
/* Quietkeep data-driven engine. Everything product-specific lives in CONFIG,

const CONFIG={"name":"Medical Crisis Companion","storageKey":"qk-medical-crisis","backupPrefix":"medical-crisis","tasks":{"tab":"Tasks","heading":"Guided Tasks","intro":"Thirty-seven steps across six phases, at whatever pace you can manage — a few now, more when you have the energy. It works the same way whether this is your own diagnosis or you're the one keeping track for someone else. Everything saves automatically on this device. Each step notes why it matters. This is an organizer to keep track of care, not medical advice: it helps you record what you're told and what you notice, so you and the care team always have the full picture. It never interprets a symptom, judges a bill, or advises on treatment, an approval, or a denial.","disclaimer":"This is an organizer, not medical advice and not a substitute for your doctors, nurses, or care team. It is not insurance advice, not tax advice, and not patient advocacy. It records what you were told and what you noticed; it does not interpret a symptom, judge a bill, or advise on your care. For any question about your health or treatment, ask your care team."},"phases":[{"name":"Phase 1 · Get Oriented","tasks":[["Note whose care this is","If you're keeping this for someone else — a spouse, a parent, a friend — put both names in the Notes tab. It takes ten seconds, and it means anyone who opens this file knows whose care it holds and who has been holding it together."],["Gather your diagnosis and care basics","The diagnosis itself, when it started, and anything else worth having in one place. Add it to the Notes tab, in your own words — not a medical record, just yours to keep straight."],["Note your insurance and coverage basics","Member ID, group number, the phone number on the back of the card, and what the plan says about the deductible and the out-of-pocket maximum. Add it to the Notes tab — you'll be asked for these on nearly every call from here on, and hunting for the card each time is its own small misery."],["List your care team","Every doctor, nurse, or specialist involved so far, and how to reach each one. Add them to the Care Team tab — the first calls you'll make when a question comes up. There's a role for the person keeping this organizer, too."],["Log your first appointment","The date, who you saw, and what was discussed. Add it to the Appointments tab — the start of a thread that will carry you through every visit that follows."],["Write down the first questions on your mind","Whatever's already occurred to you, even half-formed. Add each one to the Questions tab so it's ready for your next appointment instead of relying on memory in the room."],["Decide who else should know, and when","Family, work, close friends. This is a private choice and there's nothing to write down here — just decide, and tell people when you're ready."]]},{"name":"Phase 2 · Before Treatment Starts","tasks":[["Note where your records and paperwork live","Portal logins, physical files, the folder on the desk. Add it to the Notes tab so you — or someone helping you — can find what's needed without hunting. If care is split across more than one hospital system, note each one separately; they usually don't share."],["List the tests and scans you're waiting on","Add each one to the Test Results tab and mark it pending. The stretch between a diagnosis and the start of treatment is mostly waiting, and a list is easier to carry than a running tally in your head."],["Log every approval or referral you're waiting on","A scan, a treatment, a referral to another specialist. Add each to the Approvals tab with the reference number you were given and the date it's good through — approvals run out, and the date is easy to lose."],["If you're getting a second opinion, list the records you need copies of","Pathology reports, slides, imaging discs. Add each to the Records tab and mark whether you have it, asked for it, or haven't yet. Moving records between hospitals is usually the slow part, not the appointment itself."],["If you're taking time away from work, note each form and who has it","Add each form to the Approvals tab with the date and who's handling it. Forms for an employer and forms for an insurer are usually separate, and one doesn't stand in for the other."],["Log each call as you make it","Add every call to the Calls tab — who you spoke with, what you were told, and any reference number they gave you. These weeks are mostly phone calls, and nobody on the other end will remember the last one."]]},{"name":"Phase 3 · Track Care as It Happens","tasks":[["Log each appointment as it happens","Add every visit to the Appointments tab as soon as you can after it happens, while it's still fresh — date, provider, and type of visit."],["Note what happened and the next step after each visit","In the Appointments tab, record what you were told happened and whatever comes next — a follow-up, a referral, a test. Just what you were told, not your own read on it."],["File each test result as it comes in","Update the Test Results tab with the result summary you were given, in the words your care team used, and mark it filed."],["Build your running list of questions for the doctor","Add every question that occurs to you between visits to the Questions tab — nothing is too small to write down before it's forgotten."],["Check off each question once it's answered","In the Questions tab, mark each question answered and note the answer, so your list always shows what's still open."],["If there's a hospital stay, log it and update the medications","Add the stay to the Appointments tab, and put any medication that started, stopped, or changed into the Medications tab with the date. Discharge is where a medication list quietly changes, and the change is easy to miss afterwards."]]},{"name":"Phase 4 · Medications & Symptoms","tasks":[["List every medication you're taking","Add each one to the Medications tab — prescription, over-the-counter, and anything else taken regularly."],["Note the dose, prescriber, purpose, and when each one started","In the Medications tab, record the dose, who prescribed it, what it's for in plain words, and the date it started or last changed — not a safety check, just a record you and the care team can both see."],["Log new medications as they're prescribed","Add each new medication to the Medications tab as soon as it's prescribed, so the list is always current for the next appointment."],["Log what you're noticing as it happens","Add it to the Symptoms tab close to when you notice it — what it is and when. This is a record of what's being experienced, never a judgment of what it means."],["If your treatment runs in cycles, note the cycle and day","The Symptoms and Appointments tabs both have a place to write which cycle and day an entry falls on, if you were given a schedule. It's only a label, so that months of entries stay in order instead of becoming one long list."],["Turn any symptom that's on your mind into a question","If something in the Symptoms tab is worrying you, add it to the Questions tab so you remember to raise it, rather than trying to work out what it means on your own."]]},{"name":"Phase 5 · Money as It Arrives","tasks":[["Record each bill and EOB as it arrives, with the date of service","Add it to the Insurance & Bills tab and note both dates: the day it arrived, and the day the care actually happened. Bills for a single appointment often arrive months apart from offices you never met, and the date of service is the only thing that lines them up."],["Note what was billed, what insurance paid, and what you owe","Copy the three figures straight off your EOB into the Insurance & Bills tab, along with the claim number. This is a record of your own paperwork, not a review of it."],["Record what you've paid, and when","In the Insurance & Bills tab, note what you actually paid and the date. The running total at the top of that tab adds up what you've paid so far — the figure worth having when you're trying to work out where you stand for the year."],["Note anything that doesn't add up as a question, not a dispute","If a figure in the Insurance & Bills tab doesn't look right to you, mark it as a question to ask and add it to the Questions tab. This organizer doesn't determine whether a bill is correct — that's a conversation for the people who issued it."],["Log what you spend getting to and from care","Mileage, parking, lodging, meals on treatment days, prescriptions paid at the counter — add each to the Other Costs tab. None of it shows up on an EOB, and it adds up quietly."],["Log each call with a billing office or an insurer","Add it to the Calls tab with any reference number you were given. Billing conversations tend to repeat, and the reference number is the only part that's hard to reconstruct later."]]},{"name":"Phase 6 · Before Each Visit","tasks":[["Gather what you want covered before each appointment","Before the next visit, look over the Questions, Symptoms, and Medications tabs and note in Questions anything you want to be sure to raise."],["Print the Visit Summary before your next appointment","One click on the Visit Summary tab produces the organized picture — recent appointments, medications, symptoms, test results, records, and open questions — to bring with you."],["Print the Money & Coverage Summary when you need it","A separate one-click page on the Money & Coverage tab, with bills, what you've paid, approvals, other costs, and the plan basics — for a call with a billing office, or for whoever is helping with the paperwork. It stays off the page you hand your care team."],["Keep the appointment, symptom, and medication logs current","The Appointments, Symptoms, and Medications tabs are most useful when they're current — update them as things change, not just the night before an appointment."],["Keep everything in one private place","This file stays on your device and asks for nothing beyond what's already yours. Keep it somewhere only you can reach."],["Update it as things change","A diagnosis moves in stages. Come back after each appointment and bring the picture current — it's most useful when it's true."]]}],"registers":[{"id":"appointments","tab":"Appointments","heading":"Appointment & Treatment Tracker","noun":"appointment","statLabel":"Appointments","counterLabel":"Appointments logged","intro":"Every visit, treatment, hospital stay, and procedure, in order — who you saw, what happened, and what comes next. This is a record of what you were told and what was decided, not your own read on any of it, so the thread never breaks between one appointment and the next.","columns":[{"key":"date","label":"Date","width":"11%","type":"date"},{"key":"provider","label":"Provider / clinic","width":"18%","sample":["Dr. Alvarez — Oncology","Riverside Imaging Center","Dr. Patel — Primary care","Dr. Chen — Radiology"],"type":"text"},{"key":"type","label":"Type","width":"15%","type":"list","options":["Office visit","Treatment / infusion","Surgery","Hospital stay","Emergency department","Follow-up","Telehealth","Other"]},{"key":"cycle","label":"Cycle / day, if any","width":"12%","sample":["Cycle 3 · Day 1","Cycle 1 · Day 8","","Cycle 2 — Day 15"],"type":"text"},{"key":"whatHappened","label":"What happened","width":"26%","sample":["Reviewed scan results, discussed next steps","First infusion, tolerated well","Procedure completed without complications","Admitted for monitoring, stable overnight"],"type":"text"},{"key":"nextStep","label":"Next step","width":"18%","sample":["Follow-up in 3 weeks","Blood work before next visit","Follow-up in 2 weeks to check healing","Discharged with home care instructions"],"type":"text"}],"counter":"count"},{"id":"medications","tab":"Medications","heading":"Medication Register","noun":"medication","statLabel":"Medications","counterLabel":"Medications logged","intro":"Everything being taken, with the dose, who prescribed it, what it's for, and when it started or last changed, in plain words. This is a running record to keep the list current and easy to hand to any provider — not a safety check, and it does not flag interactions or dosages.","columns":[{"key":"name","label":"Medication","width":"20%","sample":["Metformin","Ondansetron","Lisinopril","Dexamethasone"],"type":"text"},{"key":"dose","label":"Dose & how it's taken","width":"19%","sample":["500mg, twice daily with food","4mg, as needed for nausea","10mg, once daily","4mg, before each infusion"],"type":"text"},{"key":"prescriber","label":"Prescribed by","width":"17%","sample":["Dr. Alvarez — Oncology","Dr. Chen — Primary Care","Dr. Osei — Cardiology","Dr. Alvarez — Oncology"],"type":"text"},{"key":"purpose","label":"What it's for","width":"18%","sample":["Blood sugar","Nausea from treatment","Blood pressure","Reduce inflammation / nausea"],"type":"text"},{"key":"since","label":"Started / last changed","width":"12%","type":"date"},{"key":"status","label":"Status","width":"14%","type":"list","options":["Currently taking","Paused","Stopped"]}],"counter":"count"},{"id":"symptoms","tab":"Symptoms","heading":"Symptom & Side-Effect Log","noun":"entry","statLabel":"Entries","counterLabel":"Entries logged","intro":"What you're noticing, dated, in your own words. This tab records what you told us — it never tells you what a symptom means, whether it's serious, or whether it's normal. Bring anything that concerns you to your care team; use the Questions tab to remember to.","columns":[{"key":"date","label":"Date","width":"12%","type":"date"},{"key":"cycle","label":"Cycle / day, if any","width":"12%","sample":["Cycle 3 · Day 5","Cycle 1 · Day 12","","Cycle 2 — Day 10"],"type":"text"},{"key":"symptom","label":"What you're noticing","width":"24%","sample":["Fatigue, worse in the afternoon","Nausea after the second infusion","Mild headache","Trouble sleeping"],"type":"text"},{"key":"howItFeels","label":"How it feels to you","width":"16%","type":"list","options":["Mild","Moderate","Significant","Not sure"]},{"key":"notes","label":"Notes — what you told your care team, or plan to","width":"36%","type":"text"}],"counter":"count"},{"id":"tests","tab":"Test Results","heading":"Test Result Log","noun":"test","statLabel":"Tests","counterLabel":"Tests logged","intro":"What test, what you were told, and whether the result is filed or you're still waiting. Record the result summary in the words your care team used — this tab keeps the record straight, it doesn't explain what a result means.","columns":[{"key":"date","label":"Date","width":"14%","type":"date"},{"key":"test","label":"Test / scan","width":"22%","sample":["CT scan — chest","Bloodwork — CBC","MRI — brain","Bloodwork — metabolic panel"],"type":"text"},{"key":"result","label":"Result summary — what you were told","width":"44%","sample":["No change since last scan, per Dr. Alvarez","Sent to lab; results expected in 2-3 days","Scan done; radiologist read not back yet","Slightly elevated, discuss at next visit"],"type":"text"},{"key":"filed","label":"Status","width":"20%","type":"list","options":["Filed","Pending","Waiting on results"],"sample":["Filed","Pending","Waiting on results","Filed"]}],"counter":"count"},{"id":"questions","tab":"Questions","heading":"Questions for the Doctor","noun":"question","statLabel":"Questions","counterLabel":"Questions logged","intro":"A running list so nothing you meant to ask gets forgotten in the exam room. Add a question the moment it occurs to you; check it off once it's answered, and note the answer so you don't have to ask twice. The questions are yours — this tab holds them, it doesn't supply them.","columns":[{"key":"question","label":"Question","width":"34%","sample":["Who do I call after hours?","Which office handles the scheduling for this?","What happens if I need to reschedule?","Is there a patient portal I should be using?"],"type":"text"},{"key":"source","label":"Came from","width":"16%","type":"list","options":["New concern","Symptom","Medication","Test result","Insuranc key":"from","label":"Where it's held","width":"20%","sample":["Riverside Pathology","Riverside Pathology","Northside Imaging Center","Community Hospital records"],"type":"text"},{"key":"requested","label":"Date requested","width":"14%","type":"date","sample":["2026-01-05","2026-01-18","2026-02-02",""]},{"key":"status","label":"Status","width":"16%","type":"list","options":["Have it","Requested","On the way","Not requested"]},{"key":"where","label":"Where your copy is","width":"30%","sample":["Folder on the desk","Not received yet","Not received yet",""],"type":"text"}],"counter":"category","counterField":"status"},{"id":"approvals","tab":"Approvals","heading":"Approvals & Referrals","noun":"approval","statLabel":"Approvals","counterLabel":"Approvals logged","intro":"Anything that has to be approved, referred, or filed before it can happen — a scan, a treatment, a referral to another specialist, or paperwork for time away from work. Record where each one stands, the reference number you were given, and the date you were told it's good through. This tab records the status you were told and nothing more: it doesn't advise on any of it, and what to do next is a conversation for your care team or your insurer.","columns":[{"key":"requested","label":"Date requested","width":"12%","type":"date"},{"key":"what","label":"What it's for","width":"24%","sample":["PET scan","Referral — Dr. Ito","Infusion — first cycle","Leave paperwork for work"],"type":"text"},{"key":"who","label":"Who's handling it","width":"18%","sample":["Dr. Alvarez's office","Insurance","Pharmacy benefits manager","HR at work"],"type":"text"},{"key":"status","label":"Status","width":"16%","type":"list","options":["Requested","Approved","Denied","Renewed","Not needed"]},{"key":"reference","label":"Reference number","width":"15%","sample":["AUTH-88213","REF-4471-B","PA-2026-0093","CB-77102"],"type":"text"},{"key":"goodThrough","label":"Good through","width":"15%","type":"date","sample":["","2026-06-01","","2026-09-01"]}],"counter":"category","counterField":"status"},{"id":"insurance","tab":"Insurance & Bills","heading":"Insurance Claim & EOB Tracker","noun":"bill","statLabel":"Bills","counterLabel":"Bills logged","intro":"Each bill and EOB as it arrives, copied straight off the paperwork: the day the care happened, the day the paper arrived, the claim number, what was billed, what insurance paid, what you owe, and what you've actually paid. Bills for one appointment often arrive months apart from offices you never met, so the date of service is what lines them up. This is a record of your own paperwork — it adds the figures you enter and nothing more. It never says a bill is wrong or suggests a dispute; if a figure doesn't look right to you, mark it as a question for your provider or insurer.","columns":[{"key":"serviceDate","label":"Date of service","width":"9%","type":"date","sample":["2026-01-10","2026-02-11","2026-03-12","2026-04-13"]},{"key":"date","label":"Date this arrived","width":"9%","type":"date","sample":["2026-02-11","2026-03-12","2026-04-13","2026-05-14"]},{"key":"provider","label":"Provider / service","width":"15%","sample":["Riverside Imaging Center","Dr. Alvarez — Oncology","Valley Anesthesia Group","Community Hospital"],"type":"text"},{"key":"claimNumber","label":"Claim / reference number","width":"11%","sample":["CLM-2026-00417","44821-A","HO-0093-CLM","88213-B"],"type":"text"},{"key":"billed","label":"Billed amount","width":"9%","type":"num","sample":["1200","340","85","620"]},{"key":"paid","label":"Insurer paid","width":"9%","type":"num","sample":["950","290","60","480"]},{"key":"owe","label":"What you owe","width":"9%","type":"num","sample":["250","50","25","140"]},{"key":"patientPaid","label":"What you've paid","width":"10%","type":"num","sample":["250","50","0","140"]},{"key":"datePaid","label":"Date paid","width":"9%","type":"date"},{"key":"status","label":"Status","width":"10%","type":"list","options":["Waiting on EOB","Reviewed","Question to ask","Paid"]}],"counter":"total","counterField":"patientPaid","totalLabel":"Total you've paid (as recorded)","totalUnit":"","line":"What you've recorded adds up to {total} paid so far. That is simply the sum of the figures you entered off your own statements — it is not a bill review, and any gap that doesn't look right to you is a question to bring to your provider or insurer, not a dispute this organizer resolves."},{"id":"costs","tab":"Other Costs","heading":"Other Costs","noun":"cost","statLabel":"Other costs","counterLabel":"Costs logged","intro":"The money that never appears on an EOB: mileage and gas, parking, lodging near the hospital, meals on treatment days, prescriptions paid at the counter. It adds up quietly across months. This tab adds up the amounts you enter and nothing else — whether any of it is reimbursable or deductible is a question for the program, your employer, or whoever prepares your taxes.","columns":[{"key":"date","label":"Date","width":"12%","type":"date"},{"key":"what","label":"What","width":"20%","type":"list","options":["Mileage / gas","Parking or tolls","Lodging","Meals while traveling","Prescription at the counter","Supplies","Other"]},{"key":"detail","label":"Details","width":"30%","sample":["Round trip to the infusion center","Parking, main garage","Two nights near the hospital","Meals during the hospital stay"],"type":"text"},{"key":"amount","label":"Amount","width":"14%","type":"num","sample":["42","15","168","35"]},{"key":"status","label":"Status","width":"24%","type":"list","options":["Receipt kept","No receipt","Submitted for reimbursement","Reimbursed"]}],"counter":"total","counterField":"amount","totalLabel":"Total recorded","totalUnit":"","line":"What you've recorded adds up to {total} spent getting to and from care. That is simply the sum of the amounts you entered. Whether any of it is reimbursable or deductible is a question for the program, your employer, or whoever prepares your taxes."},{"id":"calls","tab":"Calls","heading":"Calls & Messages","noun":"call","statLabel":"Calls","counterLabel":"Calls logged","intro":"Who you spoke with, what you were told, and any reference number they gave you. So much of this happens on the phone, with people who won't remember the last conversation — this keeps the thread in your own words, so you don't have to reconstruct it later. It records what you were told; it doesn't tell you what to do next.","columns":[{"key":"date","label":"Date","width":"11%","type":"date"},{"key":"who","label":"Who you spoke with","width":"17%","sample":["Maria, scheduling","Billing department","Member services — didn't catch the name","Pharmacy — automated line"],"type":"text"},{"key":"org","label":"Where","width":"15%","type":"list","options":["Doctor's office","Hospital or clinic billing","Insurance","Pharmacy","Employer or HR","Assistance program","Other"]},{"key":"about","label":"What it was about","width":"20%","sample":["Scheduling the scan","The March bill","Approval for the next cycle","Refilling a prescription"],"type":"text"},{"key":"reference","label":"Reference number they gave you","width":"15%","sample":["Case #4471","Ticket 88213-B","Ref PA-0093","Confirmation 77102"],"type":"text"},{"key":"outcome","label":"What you were told / what happens next","width":"22%","sample":["They'll call back within 3 business days","Said it was already sent to the insurer","Confirmed the appointment time","Escalated to a supervisor"],"type":"text"}],"counter":"count"}],"wishesEnabled":true,"wishes":{"tab":"Notes","heading":"Notes & What Matters","intro":"Your side of it, in your own words — whose care this is, the basics of the diagnosis, the plan details you'll be asked for on every call, where the records live, and what you want the people close to you to know. This isn't a medical record; it's yours to keep straight and share only if and when you choose.","disclaimer":"These are your own notes, not a medical record and not medical advice. This organizer is not a substitute for your care team. For any question about a diagnosis, treatment, or care, ask your doctors, nurses, or care team directly.","items":[{"key":"whose","label":"Whose care this is","prompt":"If you're keeping this for someone else, note their name and yours, and how you're related — so anyone who opens this file knows whose care it holds and who has been holding it together. If it's your own, just your name is plenty."},{"key":"basics","label":"The diagnosis and care basics","prompt":"The diagnosis, in plain words, when it started, and anything else worth having in one place — not a medical record, just yours to keep straight."},{"key":"coverage","label":"Plan and coverage basics","prompt":"Member ID, group number, the phone number on the back of the card, the plan year, and what the plan says the deductible and out-of-pocket maximum are. These get asked for on nearly every call. Remember this file isn't encrypted — if the device is shared, note only as much of a number as you're comfortable keeping here."},{"key":"records","label":"Where records and paperwork live","prompt":"Portal logins, physical files, folders — so you, or someone helping you, can find what's needed without hunting. If care is split across more than one hospital system, note each one; they usually don't share."},{"key":"family","label":"What you want your family or support person to know","prompt":"Anything you want the people close to you to understand about where things stand, or how to help."},{"key":"concerns","label":"Concerns to raise","prompt":"Anything that's been on your mind. Bring it to your care team; note it here so you remember to."},{"key":"notes","label":"Other notes","prompt":"Anything else you want in one place: reminders to yourself, things to look up, or questions that occur to you between visits. Optional."}]},"sheet":null,"sheets":[{"tab":"Visit Summary","heading":"Visit Summary","button":"Print the Visit Summary","intro":"This compiles what you've been tracking on the care side — appointments, medications, symptoms, test results, records, questions, and your care team — into one printable page to bring to your next appointment. Bills and approvals stay off this page; they have their own. Walking in organized can make visits shorter and easier.","docTitle":"What I'm Tracking for My Next Appointment","docTag":"A Visit Summary · prepared with the Quietkeep Medical Crisis Companion","lead":"This sheet gathers what has been tracked so far: appointments and treatment, medications, symptoms noticed, test results, records on hand, questions for the care team, and who is on the care team. It is an organizer output — not a medical record, not medical advice, and not a substitute for a care team.","foot":"Prepared by the patient or their support person. This Visit Summary is an organizer output, not medical advice, not a medical record, and not a substitute for a licensed care team. For any question about diagnosis, treatment, or care, consult your doctors, nurses, or care team directly.","disclaimer":"The Visit Summary is a personal organizing document to prepare for appointments, not a medical record, not medical advice, and not a substitute for your care team. Decisions about care belong with your doctors, nurses, and care team.","sections":[{"type":"wish","key":"whose","title":"Whose Care This Is","empty":"Not recorded yet — whose care this is, and who is keeping it."},{"type":"wish","key":"basics","title":"Diagnosis Basics","empty":"Not recorded yet — the diagnosis, in plain words."},{"type":"register","id":"appointments","title":"Appointments"},{"type":"register","id":"medications","title":"Medications"},{"type":"register","id":"symptoms","title":"Symptoms & Side Effects"},{"type":"register","id":"tests","title":"Test Results"},{"type":"register","id":"records","title":"Records","groupBy":"status"},{"type":"register","id":"questions","title":"Questions for the Doctor"},{"type":"register","id":"careteam","title":"Care Team"},{"type":"wishes","title":"Other Notes","exclude":["whose","basics","coverage"]}]},{"tab":"Money & Coverage","heading":"Money & Coverage Summary","button":"Print the Money & Coverage Summary","intro":"This compiles the paperwork side — bills and EOBs, what you've paid, other costs, approvals, and calls — into a separate printable page. It's the one to have in front of you for a call with a billing office or an insurer, or to hand to whoever is helping with the paperwork. It stays off the page you bring to your care team.","docTitle":"Bills, Approvals, and Coverage — Where Things Stand","docTag":"A Money & Coverage Summary · prepared with the Quietkeep Medical Crisis Companion","lead":"This sheet gathers the paperwork side of a diagnosis: bills and explanations of benefits as they arrived, what has actually been paid, other costs of getting to and from care, anything waiting on approval, and a record of the calls made. Every figure is copied from statements received. It is an organizer output — not a bill review, not insurance advice, and not tax advice.","foot":"Prepared by the patient or their support person. This summary is an organizer output. It totals figures entered by hand off statements already received; it does not review, verify, or dispute any bill, and it makes no claim that any amount is owed, incorrect, reimbursable, or deductible. For any question about a bill, a claim, or a coverage decision, contact the provider or the insurer. For any question about tax, consult whoever prepares your taxes.","disclaimer":"The Money & Coverage Summary is a personal organizing document. It is not a bill review, not insurance advice, not patient advocacy, and not tax advice. Questions about a bill or a coverage decision belong with the provider or the insurer.","sections":[{"type":"wish","key":"coverage","title":"Plan and Coverage Basics","empty":"Not recorded yet — plan, member ID, and what the plan says about the deductible and out-of-pocket maximum."},{"type":"register","id" const PHASES=CONFIG.phases;
const REGISTERS=CONFIG.registers||[];
const WISHES=(CONFIG.wishes&&CONFIG.wishes.items)||[];
const STORAGE_KEY=CONFIG.storageKey;
const SAFETY=CONFIG.safety||{};
/* A product may declare several printable outputs (`sheets`) rather than one.
   Special Needs needs this for a real reason, not tidiness: a single packet
   that compiles benefits status AND guardianship wishes is right for a future
   guardian and wrong to hand a third-grade teacher. `sheet` stays supported so
   the ten products built before this keep generating byte-identical output. */
const SHEETS=(CONFIG.sheets&&CONFIG.sheets.length)?CONFIG.sheets:(CONFIG.sheet?[CONFIG.sheet]:[]);

/* ---------- task identity ----------
   Task completion used to be stored by POSITION ("p0t3"). That meant inserting
   a task in the middle of a phase silently moved every tick below it onto a
   different task — a buyer saw work marked done that they had never done, and
   lost credit for work they had. On products whose whole promise is "nothing
   important gets missed", that is worse than losing the data outright.

   Keys are now a slug of the task title, which survives reordering, insertion
   and deletion. Verified unique within every product in the catalogue.
   `migrateTaskKeys()` converts an existing buyer's positional ticks exactly
   once, using the task order as it stood when they saved. */
function slugKey(s){
  return String(s == null ? "" : s).toLowerCase()
    .replace(/[^a-z0-9]+/g, "-").replace(/-+/g, "-")
    .replace(/^-|-$/g, "").slice(0, 48);
}

function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function nl2br(s){return esc(s).replace(/\n/g,"<br>");}
function nonEmpty(v){return v!==undefined&&v!==null&&String(v).trim()!=="";}
function money(n){return "$"+(Math.round(n*100)/100).toLocaleString("en-US",{minimumFractionDigits:0,maximumFractionDigits:2});}
function plain(n){return (Math.round(n*100)/100).toLocaleString("en-US");}
/* Totals are money by default — the estate and divorce lines all count dollars.
   Some registers count minutes or plain units instead (service delivery, for
   one), so a register may set totalFormat:"plain" with totalUnit:"minutes". */
function fmtTotal(reg,n){
  return reg.totalFormat==="plain"
    ? plain(n)+(reg.totalUnit?" "+reg.totalUnit:"")
    : money(n);
}
function fmtCell(col,v){
  if(col.format==="plain")return plain(parseFloat(v)||0);
  return money(parseFloat(v)||0);
}
/* A "calc" column is derived and never stored: calc:["a","b"] with op "*" or
   "-". It keeps the arithmetic a buyer would otherwise do by hand — quantity
   x cost-each, or actual minus normal — inside the engine, where it stays
   correct as rows change instead of going stale the moment anything is edited. */
function calcVal(reg,row,col){
  const a=(col.calc||[])[0],b=(col.calc||[])[1];
  const x=parseFloat(row[a])||0,y=parseFloat(row[b])||0;
  return col.op==="-"?(x-y):(x*y);
}
function cellVal(reg,row,col){return col.type==="calc"?calcVal(reg,row,col):row[col.key];}
function regById(id){return REGISTERS.find(r=>r.id===id);}
function colByKey(reg,key){return reg.columns.find(c=>c.key===key);}
function numKey(reg){const c=reg.columns.find(c=>c.type==="num");return c?c.key:null;}

/* ---------- state ---------- */
let state=null;
/* Stable per-task keys, computed once from the current phase order. */
const TASK_KEYS=PHASES.map(ph=>(ph.tasks||[]).map(t=>slugKey(t[0])));

/* Convert positional task ticks to stable keys, once, on first open of an
   updated file. `legacyTasks` is the task order AS THE BUYER HAS IT — needed
   only when a release reorders tasks in the same version that introduces this
   migration. Otherwise the current order is the buyer's order, so it is the
   correct fallback and the migration is exact. */
function migrateTaskKeys(){
  if(state.tkv>=2){return;}
  const legacy=CONFIG.legacyTasks||PHASES.map(ph=>(ph.tasks||[]).map(t=>t[0]));
  const out={};
  (legacy||[]).forEach((ph,pi)=>(ph||[]).forEach((title,ti)=>{
    if(state.tasks&&state.tasks["p"+pi+"t"+ti])out[slugKey(title)]=true;
  }));
  /* Preserve any keys that are already slugs — a re-restored backup, or a file
     opened by a newer build first. Never drop a tick we cannot explain. */
  Object.keys(state.tasks||{}).forEach(k=>{
    if(!/^p\d+t\d+$/.test(k)&&state.tasks[k])out[k]=true;
  });
  state.tasks=out;
  state.tkv=2;
}

function defaultState(){
  const d={v:1,tkv:2,tasks:{},wishes:{},lastReviewed:null};
  REGISTERS.forEach(r=>{d[r.id]=[];});
  return d;
}
function load(){
  try{const raw=localStorage.getItem(STORAGE_KEY);state=raw?JSON.parse(raw):defaultState();}
  catch(e){state=defaultState();}
  REGISTERS.forEach(r=>{if(!Array.isArray(state[r.id]))state[r.id]=[];});
  if(typeof state.tasks!=="object"||!state.tasks)state.tasks={};
  if(typeof state.wishes!=="object"||!state.wishes)state.wishes={};
  if(state.lastReviewed===undefined)state.lastReviewed=null;
  migrateTaskKeys();
}
function save(){
  try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state));
    document.getElementById("save-status").innerHTML="<b>All changes saved on this device</b>";}
  catch(e){document.getElementById("save-status").innerHTML="<b>Could not save — download a backup from the Summary tab</b>";}
}

/* ---------- shell: nav + sections built from CONFIG ---------- */
function buildShell(){
  const nav=document.getElementById("nav");
  const wrap=document.getElementById("sections");
  const tabs=[{id:"tasks",label:CONFIG.tasks.tab||"Tasks"}];
  REGISTERS.forEach(r=>tabs.push({id:r.id,label:r.tab}));
  if(CONFIG.wishesEnabled)tabs.push({id:"wishes",label:CONFIG.wishes.tab||"Wishes"});
  SHEETS.forEach((s,i)=>tabs.push({id:"sheet"+i,label:s.tab||"Instruction Sheet"}));
  tabs.push({id:"summary",label:"Summary & Backup"});
  tabs.forEach((t,i)=>{
    const b=document.createElement("button");
    b.dataset.tab=t.id;b.textContent=t.label;if(i===0)b.className="active";
    nav.appendChild(b);
  });

  let h="";
  // Tasks
  h+='<section class="tab active" id="tab-tasks"><h2>'+esc(CONFIG.tasks.heading||"Guided Tasks")+'</h2>'+
     '<p class="note">'+esc(CONFIG.tasks.intro||"")+'</p><div id="phases"></div>'+
     (CONFIG.tasks.disclaimer?'<p class="disclaimer">'+esc(CONFIG.tasks.disclaimer)+'</p>':"")+
     '</section>';
  // Registers
  REGISTERS.forEach(r=>{
    /* A register may carry a `warn` — one prominent, red, shown-once line under
       the intro. Wishes already had this; registers did not, so a prohibition
       as load-bearing as "never the codes themselves" could only be muted grey
       prose. Deliberately register-level, not per-column: a warning repeated on
       every row of a table stops being read by row three. */
    h+='<section class="tab" id="tab-'+esc(r.id)+'"><h2>'+esc(r.heading)+'</h2>'+
       '<p class="note">'+esc(r.intro||"")+'</p>'+
       (r.warn?'<p class="warnline">'+esc(r.warn)+'</p>':"")+
       // A many-column register needs real pixel width to stay legible — 70px
       // per column is roughly what a narrow text/number input needs, so a
       // 13-column table gets ~910px minimum rather than being crushed into
       // whatever fraction of 1040px is left after padding.
       // 70px/column still clipped a 2-digit number input to its first digit
       // (spinner arrows + input padding eat more of a narrow cell than the
       // math suggested) — verified by looking at the actual render, not by
       // recomputing the math a second time. 85px holds up on inspection.
       '<div class="table-wrap"><table style="min-width:'+(85*(r.columns.length+1))+'px"><thead><tr>';
    r.columns.forEach(c=>{h+='<th'+(c.width?' style="width:'+esc(c.width)+'"':"")+'>'+esc(c.label)+'</th>';});
    h+='<th style="width:36px"></th></tr></thead><tbody id="'+esc(r.id)+'-body"></tbody></table></div>'+
       '<button class="add" data-add="'+esc(r.id)+'">+ Add '+esc(r.noun||"row")+'</button>';
    if(r.counter&&r.counter!=="none")h+='<div class="totals" id="'+esc(r.id)+'-total"></div>';
    if(r.counter==="total"&&r.line)h+='<p class="note" id="'+esc(r.id)+'-line" style="margin-top:6px"></p>';
    if(r.disclaimer)h+='<p class="disclaimer">'+esc(r.disclaimer)+'</p>';
    h+='</section>';
  });
  // Wishes
  if(CONFIG.wishesEnabled){
    h+='<section class="tab" id="tab-wishes"><h2>'+esc(CONFIG.wishes.heading||"Wishes & Instructions")+'</h2>'+
       '<p class="note">'+esc(CONFIG.wishes.intro||"")+'</p><div id="wishes-body"></div>'+
       (CONFIG.wishes.disclaimer?'<p class="disclaimer">'+esc(CONFIG.wishes.disclaimer)+'</p>':"")+
       '</section>';
  }
  // Sheet
  SHEETS.forEach((S,i)=>{
    h+='<section class="tab" id="tab-sheet'+i+'"><h2>'+esc(S.heading)+'</h2>'+
       '<p class="note">'+esc(S.intro||"")+'</p>'+
       '<div id="sheet-preview-'+i+'" class="review-box"></div>'+
       '<div class="toolbar"><button class="primary" onclick="printSheet('+i+')">'+esc(S.button||"Print the Instruction Sheet")+'</button></div>'+
       (S.disclaimer?'<p class="disclaimer">'+esc(S.disclaimer)+'</p>':"")+
       '</section>';
  });
  // Summary
  h+='<section class="tab" id="tab-summary"><h2>Summary &amp; Backup</h2>'+
     '<p class="note">'+esc(CONFIG.summary.intro||"See where you stand, keep this current, and back up your work to a file you control.")+'</p>'+
     '<div id="summary-stats"></div>'+
     '<div class="review-box"><div class="rl" id="review-line">Last reviewed: <strong>not yet reviewed</strong></div>'+
     '<p class="note" style="margin:6px 0 10px">'+esc(CONFIG.summary.reviewNote||"Mark today as reviewed after any pass, and again after anything meaningful changes.")+'</p>'+
     '<div class="toolbar" style="margin-top:0"><button class="primary" onclick="markReviewed()">Mark reviewed today</button></div></div>'+
     '<div class="toolbar">'+
     SHEETS.map((S,i)=>'<button onclick="printSheet('+i+')">'+esc(S.button||"Print the Instruction Sheet")+'</button>').join("")+
     '<button onclick="printAll()">Print everything (all registers)</button>'+
     '<button onclick="backup()">Download backup file</button>'+
     '<button onclick="document.getElementById(\'restore-file\').click()">Restore from backup</button>'+
     '<input type="file" id="restore-file" accept=".json" style="display:none" onchange="restore(this)">'+
     '</div>'+
     (CONFIG.summary.disclaimer?'<p class="disclaimer">'+esc(CONFIG.summary.disclaimer)+'</p>':"")+
     '</section>';
  wrap.innerHTML=h;
  wrap.querySelectorAll("button.add").forEach(b=>b.addEventListener("click",()=>addRow(b.dataset.add)));
}

/* ---------- task engine ---------- */
function renderTasks(){
  const wrap=document.getElementById("phases");wrap.innerHTML="";
  PHASES.forEach((ph,pi)=>{
    let pDone=0;
    const div=document.createElement("div");div.className="phase";
    const h=document.createElement("h3");h.textContent=ph.name;div.appendChild(h);
    const bar=document.createElement("div");bar.className="bar";const fill=document.createElement("div");bar.appendChild(fill);div.appendChild(bar);
    ph.tasks.forEach((t,ti)=>{
      const id=TASK_KEYS[pi][ti];
      const checked=!!state.tasks[id];if(checked)pDone++;
      const row=document.createElement("div");row.className="task"+(checked?" done":"");
      const cb=document.createElement("input");cb.type="checkbox";cb.checked=checked;
      cb.addEventListener("change",()=>{state.tasks[id]=cb.checked;save();row.classList.toggle("done",cb.checked);updateProgress();});
      const body=document.createElement("div");
      body.innerHTML='<div class="t"></div><div class="why"></div>';
      body.querySelector(".t").textContent=t[0];
      body.querySelector(".why").textContent=t[1]||"";
      row.appendChild(cb);row.appendChild(body);div.appendChild(row);
    });
    fill.style.width=Math.round(pDone/ph.tasks.length*100)+"%";
    wrap.appendChild(div);
  });
  updateProgress();
}
function taskCounts(){let total=0,done=0;PHASES.forEach((ph,pi)=>ph.tasks.forEach((t,ti)=>{total++;if(state.tasks[TASK_KEYS[pi][ti]])done++;}));return{total,done};}
function updateProgress(){
  let total=0,done=0;
  document.querySelectorAll("#phases .phase").forEach((div)=>{
    let pDone=0;const boxes=div.querySelectorAll(".task input[type=checkbox]");
    boxes.forEach(b=>{total++;if(b.checked){done++;pDone++;}});
    div.querySelector(".bar>div").style.width=Math.round(pDone/boxes.length*100)+"%";
  });
  const pct=total?Math.round(done/total*100):0;
  document.getElementById("overall-bar").style.width=pct+"%";
  document.getElementById("overall-label").textContent="Overall progress · "+done+" of "+total+" tasks ("+pct+"%)";
  summaryStats();
}

/* ---------- register engine ---------- */
function fieldEl(reg,row,col){
  const td=document.createElement("td");
  /* Derived cells are output, not input — render as read-only text so nobody
     types into a number that is about to be recomputed. refreshCalc() keeps
     them current as the columns they depend on are edited. */
  if(col.type==="calc"){
    td.className="num";
    td.textContent=fmtCell(col,calcVal(reg,row,col));
    return td;
  }
  let el;
  if(col.type==="select"){el=document.createElement("select");
    (col.options||[]).forEach(o=>{const op=document.createElement("option");op.value=o;op.textContent=o;el.appendChild(op);});
    el.value=row[col.key]||(col.options||[""])[0];}
  else if(col.type==="list"){el=document.createElement("input");el.type="text";
    const dl=document.createElement("datalist");const dlid="dl-"+reg.id+"-"+col.key+"-"+Math.random().toString(36).slice(2,8);
    dl.id=dlid;(col.options||[]).forEach(o=>{const op=document.createElement("option");op.value=o;dl.appendChild(op);});
    el.setAttribute("list",dlid);td.appendChild(dl);
    el.value=row[col.key]!==undefined?row[col.key]:"";}
  else{el=document.createElement("input");el.type=col.type==="num"?"number":(col.type==="date"?"date":"text");
    if(col.type==="num"){el.step="0.01";td.className="num";}
    el.value=row[col.key]!==undefined?row[col.key]:"";}
  el.addEventListener("input",()=>{row[col.key]=el.value;save();totals();});
  el.addEventListener("change",()=>{row[col.key]=el.value;save();totals();});
  td.appendChild(el);return td;
}
function renderTable(id){
  const reg=regById(id);
  const body=document.getElementById(id+"-body");body.innerHTML="";
  state[id].forEach((row,i)=>{
    const tr=document.createElement("tr");
    reg.columns.forEach(c=>tr.appendChild(fieldEl(reg,row,c)));
    const td=document.createElement("td");
    const del=document.createElement("button");del.className="del";del.textContent="✕";del.title="Remove row";
    del.addEventListener("click",()=>{if(confirm("Remove this row?")){state[id].splice(i,1);save();renderTable(id);totals();}});
    td.appendChild(del);tr.appendChild(td);body.appendChild(tr);
  });
}
function addRow(id){state[id].push({});save();renderTable(id);totals();}
function categoryCounts(reg){
  const field=reg.counterField;const cats=(colByKey(reg,field)||{}).options||[];
  const counts={};
  state[reg.id].forEach(r=>{const c=cats.indexOf(r[field])>=0?r[field]:(r[field]||cats[0]);counts[c]=(counts[c]||0)+1;});
  return counts;
}
function regTotal(reg){
  const k=reg.counterField||numKey(reg);
  const col=colByKey(reg,k);
  if(col&&col.type==="calc")return state[reg.id].reduce((s,r)=>s+calcVal(reg,r,col),0);
  return state[reg.id].reduce((s,r)=>s+(parseFloat(r[k])||0),0);
}
/* Repaint derived cells in place. Re-rendering the whole table would steal
   focus from the field being typed into, which is why this updates the td
   text directly rather than calling renderTable(). */
function refreshCalc(){
  REGISTERS.forEach(reg=>{
    if(!reg.columns.some(c=>c.type==="calc"))return;
    const body=document.getElementById(reg.id+"-body");if(!body)return;
    Array.prototype.forEach.call(body.rows,(tr,i)=>{
      const row=state[reg.id][i];if(!row)return;
      reg.columns.forEach((c,ci)=>{
        if(c.type!=="calc")return;
        const td=tr.cells[ci];if(td)td.textContent=fmtCell(c,calcVal(reg,row,c));
      });
    });
  });
}
function totals(){
  refreshCalc();
  REGISTERS.forEach(reg=>{
    const el=document.getElementById(reg.id+"-total");
    const noun=reg.noun||"row";const plural=reg.nounPlural||noun+"s";
    const label=reg.counterLabel||((plural.charAt(0).toUpperCase()+plural.slice(1))+" recorded");
    if(reg.counter==="category"&&el){
      const cats=(colByKey(reg,reg.counterField)||{}).options||[];
      const counts=categoryCounts(reg);
      const bits=cats.filter(c=>counts[c]).map(c=>c+" <strong>"+counts[c]+"</strong>");
      const extra=Object.keys(counts).filter(c=>cats.indexOf(c)<0).map(c=>c+" <strong>"+counts[c]+"</strong>");
      el.innerHTML=label+": <strong>"+state[reg.id].length+"</strong>"+(bits.length||extra.length?" · "+bits.concat(extra).join(" · "):"");
    }else if(reg.counter==="total"&&el){
      const n=state[reg.id].length;
      el.innerHTML=(reg.totalLabel||"Total")+": <strong>"+fmtTotal(reg,regTotal(reg))+"</strong><span class=\"pill\">"+n+" "+(n===1?noun:plural)+"</span>";
      const line=document.getElementById(reg.id+"-line");
      if(line)line.textContent=n?reg.line.replace("{total}",fmtTotal(reg,regTotal(reg))).replace("{n}",n):"";
    }else if(el){
      el.innerHTML=label+": <strong>"+state[reg.id].length+"</strong>";
    }
  });
  summaryStats();renderSheetPreview();
}

/* ---------- wishes ---------- */
function renderWishes(){
  const wrap=document.getElementById("wishes-body");if(!wrap)return;
  wrap.innerHTML="";
  WISHES.forEach(w=>{
    const div=document.createElement("div");div.className="wish";
    const lab=document.createElement("label");lab.textContent=w.label;lab.setAttribute("for","wish-"+w.key);div.appendChild(lab);
    const pr=document.createElement("div");pr.className="prompt";pr.textContent=w.prompt||"";div.appendChild(pr);
    const ta=document.createElement("textarea");ta.id="wish-"+w.key;ta.value=state.wishes[w.key]||"";
    ta.addEventListener("input",()=>{state.wishes[w.key]=ta.value;save();});
    div.appendChild(ta);
    if(w.warn){const wn=document.createElement("div");wn.className="warnline";wn.textContent=w.warn;div.appendChild(wn);}
    wrap.appendChild(div);
  });
}

/* ---------- summary + review ---------- */
function summaryStats(){
  const c=taskCounts();
  const el=document.getElementById("summary-stats");if(!el)return;
  const bits=REGISTERS.map(reg=>{
    const noun=reg.noun||"row";const plural=reg.nounPlural||noun+"s";
    const label=reg.statLabel||(plural.charAt(0).toUpperCase()+plural.slice(1));
    let s=label+": <strong>"+state[reg.id].length+"</strong>";
    if(reg.counter==="total")s+=" ("+money(regTotal(reg))+(reg.totalUnit?" "+reg.totalUnit:"")+")";
    return s;
  });
  el.innerHTML='<div class="totals">Tasks complete: <strong>'+c.done+' / '+c.total+'</strong><span class="pill">'+(c.total?Math.round(c.done/c.total*100):0)+'%</span><br>'+bits.join(" · ")+'</div>';
  renderReviewLine();
}
function daysSince(iso){if(!iso)return null;const then=new Date(iso+"T00:00:00");const now=new Date();return Math.floor((now-then)/86400000);}
function renderReviewLine(){
  const line=document.getElementById("review-line");
  if(line){
    if(state.lastReviewed){line.innerHTML="Last reviewed: <strong>"+new Date(state.lastReviewed+"T00:00:00").toLocaleDateString()+"</strong>";}
    else{line.innerHTML="Last reviewed: <strong>not yet reviewed</strong>";}
  }
  const flag=document.getElementById("review-flag");if(!flag)return;
  const dd=daysSince(state.lastReviewed);
  if(dd!==null&&dd>=365){flag.classList.add("show");flag.textContent=CONFIG.summary.staleFlag||"It has been more than a year since your last review. Open the Summary tab when you have a few minutes.";}
  else{flag.classList.remove("show");flag.textContent="";}
}
function markReviewed(){
  const now=new Date();const iso=now.getFullYear()+"-"+String(now.getMonth()+1).padStart(2,"0")+"-"+String(now.getDate()).padStart(2,"0");
  state.lastReviewed=iso;save();renderReviewLine();
}

/* ---------- print sheet (compiled from CONFIG.sheet.sections) ---------- */
function registerTableHTML(reg,rows,skipKey){
  let h='<table><tr>';
  reg.columns.forEach(c=>{if(c.key!==skipKey)h+='<th>'+esc(c.label)+'</th>';});
  h+='</tr>';
  rows.forEach(r=>{h+='<tr>';
    reg.columns.forEach(c=>{if(c.key===skipKey)return;
      const v=(c.type==="num"||c.type==="calc")?fmtCell(c,cellVal(reg,r,c)):esc(r[c.key]);
      h+='<td>'+v+'</td>';});
    h+='</tr>';});
  if(reg.counter==="total"){
    h+='<tr><td><strong>'+esc(reg.totalLabel||"Total")+'</strong>';
    const nk=reg.counterField||numKey(reg);
    reg.columns.forEach(c=>{if(c.key===skipKey||c.key===reg.columns[0].key)return;
      h+=c.key===nk?'<td><strong>'+fmtTotal(reg,regTotal(reg))+'</strong></td>':'<td></td>';});
    h=h.replace(/<td><\/td>$/,'<td colspan="1"></td>');
    h+='</tr>';
  }
  return h+'</table>';
}
function sheetHTML(idx){
  const S=SHEETS[idx||0]||{};
  let h='<h1>'+esc(S.docTitle)+'</h1><div class="ph">'+esc(S.docTag)+' &middot; '+new Date().toLocaleDateString()+'</div>';
  if(S.lead)h+='<p class="lead">'+esc(S.lead)+'</p>';
  (S.sections||[]).forEach(sec=>{
    h+='<h2>'+esc(sec.title)+'</h2>';
    if(sec.type==="wish"){
      const v=state.wishes[sec.key];
      if(nonEmpty(v))h+='<div class="wblock">'+nl2br(v)+'</div>';
      else h+='<p>'+esc(sec.empty||"Not recorded yet.")+'</p>';
    }else if(sec.type==="register"){
      const reg=regById(sec.id);const rows=state[sec.id];
      if(!rows.length){h+='<p>'+esc(sec.empty||("No "+(reg.nounPlural||((reg.noun||"row")+"s"))+" recorded yet."))+'</p>';return;}
      if(sec.groupBy){
        const cats=(colByKey(reg,sec.groupBy)||{}).options||[];
        /* Grouping by a column that has no `options` (a date, or free text) is
           legitimate — but then cats is empty, and a blank cell used to fall
           through to cats[0] === undefined and print "undefined (3)" as a
           heading on the buyer's printed sheet. Bucket those explicitly. */
        const counts={};rows.forEach(r=>{const c=cats.indexOf(r[sec.groupBy])>=0?r[sec.groupBy]:(r[sec.groupBy]||cats[0]||"Not recorded");counts[c]=(counts[c]||0)+1;});
        const order=cats.filter(c=>counts[c]).concat(Object.keys(counts).filter(c=>cats.indexOf(c)<0));
        order.forEach(c=>{
          h+='<h3>'+esc(c)+' ('+counts[c]+')</h3>';
          h+=registerTableHTML(reg,rows.filter(r=>{const rc=cats.indexOf(r[sec.groupBy])>=0?r[sec.groupBy]:(r[sec.groupBy]||cats[0]||"Not recorded");return rc===c;}),sec.groupBy);
        });
      }else{
        h+=registerTableHTML(reg,rows,null);
      }
    }else if(sec.type==="wishes"){
      let any=false;const excl=sec.exclude||[];
      WISHES.forEach(w=>{if(excl.indexOf(w.key)>=0)return;const v=state.wishes[w.key];if(!nonEmpty(v))return;any=true;
        h+='<h3>'+esc(w.label)+'</h3><div class="wblock">'+nl2br(v)+'</div>';});
      if(!any)h+='<p>'+esc(sec.empty||"No wishes recorded yet.")+'</p>';
    }
  });
  if(S.foot)h+='<p class="foot">'+esc(S.foot)+'</p>';
  return h;
}
function renderSheetPreview(){
  SHEETS.forEach((S,i)=>{
    const el=document.getElementById("sheet-preview-"+i);if(!el)return;
    /* Preview only the registers this particular sheet actually compiles —
       otherwise a teacher-facing sheet would advertise the benefits and
       guardianship data it deliberately leaves out. */
    const ids=(S.sections||[]).filter(s=>s.type==="register").map(s=>s.id);
    const regs=ids.length?REGISTERS.filter(r=>ids.indexOf(r.id)>=0):REGISTERS;
    const bits=regs.map(reg=>{
      const noun=reg.noun||"row";const plural=reg.nounPlural||noun+"s";
      const n=state[reg.id].length;
      let s=n+" "+(n===1?noun:plural);
      if(reg.counter==="total")s+=" ("+fmtTotal(reg,regTotal(reg))+")";
      return s;
    });
    const hasWishes=(S.sections||[]).some(s=>s.type==="wish"||s.type==="wishes");
    el.innerHTML='<div class="rl" style="margin-bottom:6px">Preview — <strong>'+esc(S.docTitle)+'</strong></div>'+
      '<p class="note" style="margin:0">'+esc(S.previewLead||"This packet will include:")+' '+esc(bits.join(", "))+
      (hasWishes?", plus what you've written in your own words":"")+'. Fill in more on the other tabs to make the sheet more complete, then print it.</p>';
  });
}
function printSheet(idx){
  const pa=document.getElementById("print-area");
  pa.innerHTML=sheetHTML(idx||0);window.print();
}
function printAll(){
  const pa=document.getElementById("print-area");
  let h=sheetHTML();
  h+='<h2>Guided Task Progress</h2>';
  PHASES.forEach((ph,pi)=>{
    h+='<h3>'+esc(ph.name)+'</h3><table><tr><th>Done</th><th>Task</th></tr>';
    ph.tasks.forEach((t,ti)=>{h+='<tr><td>'+(state.tasks[TASK_KEYS[pi][ti]]?"✓":"")+'</td><td>'+esc(t[0])+'</td></tr>';});
    h+='</table>';
  });
  pa.innerHTML=h;window.print();
}

/* ---------- safety notice + erase ----------
   Two facts every Quietkeep product must state plainly, because neither is
   obvious and both can hurt someone: (1) "local" is not "private" when the
   person you fear shares the device; (2) localStorage is keyed to the browser,
   NOT to the file — deleting the .html does not delete the entries. Products
   that need more (the divorce line) add an `app.safety` block to the manifest. */
const DEFAULT_STORAGE_TRUTH="Nothing you type is ever sent anywhere — it is saved only in this browser, on this device. That also means anyone who can use this device and this browser can open it. It is not encrypted and not password-protected.";
const DEFAULT_ERASE_TRUTH="Deleting this file does NOT erase what you have entered. Your entries are stored by the browser, not inside the file. To remove them, use the “Erase everything” button at the bottom of the screen.";

function showNotice(){
  document.getElementById("qk-notice-h").textContent=SAFETY.title||"Before you start";
  let h="";
  (SAFETY.body||[]).forEach(p=>{h+='<p>'+esc(p)+'</p>';});
  h+='<p>'+esc(SAFETY.storage||DEFAULT_STORAGE_TRUTH)+'</p>';
  h+='<p>'+esc(SAFETY.erase||DEFAULT_ERASE_TRUTH)+'</p>';
  if(SAFETY.hotline&&SAFETY.hotline.length){
    h+='<div class="hot">';
    SAFETY.hotline.forEach((l,i)=>{h+=(i?'<br>':'')+(i?'<b>'+esc(l)+'</b>':esc(l));});
    h+='</div>';
  }
  const fine=SAFETY.fine||CONFIG.summary.disclaimer||"";
  if(fine)h+='<div class="fine">'+esc(fine)+'</div>';
  document.getElementById("qk-notice-body").innerHTML=h;
  const v=document.getElementById("qk-veil");
  v.hidden=false;
  document.getElementById("qk-notice-ok").focus();
}
function dismissNotice(){document.getElementById("qk-veil").hidden=true;}

/* How much is actually at risk — a concrete number warns far better than
   "everything", and lets an empty file erase without ceremony. */
function countEntries(){
  let n=0;
  REGISTERS.forEach(r=>{(state[r.id]||[]).forEach(row=>{
    if(r.columns.some(c=>nonEmpty(row[c.key])))n++;
  });});
  Object.keys(state.wishes||{}).forEach(k=>{if(nonEmpty(state.wishes[k]))n++;});
  Object.keys(state.tasks||{}).forEach(k=>{if(state.tasks[k])n++;});
  return n;
}

function eraseAll(){
  const n=countEntries();
  if(n===0){alert("There is nothing saved to erase yet.");return;}
  const noun=n===1?"entry":"entries";
  /* Two steps on purpose. This button is always on screen, so one stray click
     must never be able to destroy someone's work — but it also has to stay fast
     enough to use when you need the screen clear right now. */
  if(!confirm("ERASE EVERYTHING?\n\n"
    +"This permanently deletes all "+n+" "+noun+" you have saved in this browser for "+CONFIG.name+".\n\n"
    +"THIS CANNOT BE UNDONE. There is no way to get it back afterwards.\n\n"
    +"It does NOT delete any backup file you have already downloaded, or anything you have printed.\n\n"
    +"If you want to keep a copy, press Cancel and use “Download backup file” on the Summary tab first."))return;
  if(!confirm("Last check.\n\nReally erase all "+n+" saved "+noun+" permanently?"))return;
  state=defaultState();
  renderAll();
  /* Remove AFTER re-rendering, so nothing can write the key back on the way out. */
  try{localStorage.removeItem(STORAGE_KEY);}catch(e){}
  document.getElementById("save-status").innerHTML="<b>Erased from this browser</b>";
  alert("Erased. Nothing from this organizer is left in this browser.\n\n"
    +"If you also downloaded a backup file or printed a copy, delete those separately.");
}

/* ---------- backup / restore ---------- */
function backup(){
  const blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"});
  const aEl=document.createElement("a");aEl.href=URL.createObjectURL(blob);
  aEl.download=CONFIG.backupPrefix+"-backup-"+new Date().toISOString().slice(0,10)+".json";
  document.body.appendChild(aEl);aEl.click();aEl.remove();
}
function restore(input){
  const f=input.files[0];if(!f)return;
  const reader=new FileReader();
  reader.onload=()=>{try{const data=JSON.parse(reader.result);
      if(!data||typeof data!=="object")throw 0;
      state=Object.assign(defaultState(),data);
      REGISTERS.forEach(r=>{if(!Array.isArray(state[r.id]))state[r.id]=[]});
      if(typeof state.wishes!=="object"||!state.wishes)state.wishes={};
      save();renderAll();alert("Backup restored.");}
    catch(e){alert("That file does not look like a valid backup.");}};
  reader.readAsText(f);input.value="";
}

/* ---------- boot ---------- */
document.getElementById("nav").addEventListener("click",e=>{
  if(e.target.tagName!=="BUTTON")return;
  document.querySelectorAll("nav button").forEach(b=>b.classList.remove("active"));
  document.querySelectorAll("section.tab").forEach(s=>s.classList.remove("active"));
  e.target.classList.add("active");
  document.getElementById("tab-"+e.target.dataset.tab).classList.add("active");
  if(String(e.target.dataset.tab||"").indexOf("sheet")===0)renderSheetPreview();
});
function renderAll(){renderTasks();REGISTERS.forEach(r=>renderTable(r.id));renderWishes();totals();renderReviewLine();renderSheetPreview();}
document.getElementById("qk-notice-ok").addEventListener("click",dismissNotice);
